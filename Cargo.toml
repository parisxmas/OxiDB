[workspace]
members = [".", "oxidb-server", "oxidb-client-ffi", "oxidb-embedded-ffi", "oxidb-cli", "oxidb-tail", "oxipool", "oxidb-wasm"]
resolver = "3"

[package]
name = "oxidb"
version = "0.28.0"
edition = "2024"
description = "A fast document database engine with optimized date indexing"
license = "AGPL-3.0-only"
repository = "https://github.com/parisxmas/OxiDB"
readme = "README.md"

[features]
default = []
ocr = ["leptess", "image"]
gpu = ["wgpu", "pollster", "bytemuck"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
crc32fast = "1"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.9"
leptess = { version = "0.14", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "tiff", "bmp", "gif", "webp"] }
jsonb = "0.5"
lru = "0.12"
regex = "1"
sqlparser = "0.59"
scc = "3"
rust-stemmers = "1"
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

# Native-only dependencies (filesystem, threads, memory-mapped I/O)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parking_lot = "0.12"
memmap2 = "0.9"
rayon = "1.10"
pdf-extract = "0.7"
zip = "2"
tar = "0.4"
flate2 = "1"
zstd = "0.13"
lz4_flex = "0.11"

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
spin = "0.9"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "bench_vs_sqlite"
path = "examples/bench_vs_sqlite.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
