[workspace]
members = [".", "oxidb-server", "oxidb-client-ffi", "oxidb-embedded-ffi", "oxidb-cli", "oxidb-tail", "oxipool", "oxidb-wasm", "oxidb-agg-merge", "oxidb-sql", "oxidb-cobra", "oxidb-tsdb", "oxidb-http", "oxibase", "oxidb-client", "oxidb-mcp"]
resolver = "3"

[package]
name = "oxidb"
version = "0.42.12"
edition = "2024"
description = "A fast document database engine with optimized date indexing"
license-file = "LICENSE"
repository = "https://github.com/parisxmas/OxiDB"
readme = "README.md"

[features]
default = ["doc-formats"]
ocr = ["leptess", "image"]
# PDF/DOCX/XLSX text extraction for full-text search. Default ON; mobile
# "lite" builds turn it off — pdf-extract alone is megabytes of fonts and
# decoders, and a phone app indexing its own documents rarely feeds PDFs.
doc-formats = ["dep:pdf-extract", "dep:zip"]
gpu = ["wgpu", "pollster", "bytemuck"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
crc32fast = "1"
sha2 = "0.10"
# S3 defines the ETag of a single-part object as the MD5 of its bytes. Not a
# security choice — an ETag is an identity, and every S3 client verifies it as one.
md-5 = "0.10"
aes-gcm = "0.10"
rand = "0.9"
leptess = { version = "0.14", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "tiff", "bmp", "gif", "webp"] }
jsonb = "0.5"
lru = "0.12"
regex = "1"
scc = "3"
rust-stemmers = "1"
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

# Native-only dependencies (filesystem, threads, memory-mapped I/O)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parking_lot = "0.12"
memmap2 = "0.9"
rayon = "1.10"
pdf-extract = { version = "0.7", optional = true }
zip = { version = "2", optional = true }
tar = "0.4"
flate2 = "1"
zstd = "0.13"
lz4_flex = "0.11"

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
spin = "0.9"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
tempfile = "3"
# Tests build DOCX/XLSX fixtures with the zip writer even though the
# doc-formats feature owns the runtime dependency.
zip = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
oxidb-agg-merge = { path = "oxidb-agg-merge" }

[[example]]
name = "demo"
path = "examples/demo.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Optimised like release but with symbols kept, for profiling and for reading
# a stack out of a wedged process. `strip = true` on release is why a `sample`
# Mobile builds: size first. Every ABI ships this binary inside an app, so
# a 20% size cut (measured: 12.3 -> 9.8 MB on arm64) outweighs the longer
# compile. `clients/android/build.sh` and the iOS xcframework build use it.
[profile.mobile]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

# of a hung server shows nothing but addresses. LTO is off and codegen units
# raised because this profile exists to be rebuilt quickly, not shipped.
[profile.release-dbg]
inherits = "release"
strip = false
debug = true
lto = false
codegen-units = 16
