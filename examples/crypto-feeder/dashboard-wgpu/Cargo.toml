[package]
name = "dashboard-wgpu"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wgpu = "23"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_log = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "CanvasRenderingContext2d",
    "ImageData",
    "TextMetrics",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "Event",
    "Location",
    "MouseEvent",
    "EventTarget",
    "Performance",
    "console",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
]

[profile.release]
opt-level = "s"
lto = true
