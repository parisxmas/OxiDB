# /etc/nginx/conf.d/oxidb-embedded-django.baltavista.com.conf
#
# Public port 443 on this host is owned by an `ssl_preread` SNI-router
# in /etc/nginx/nginx.conf that routes everything except chat.kartex.net
# to a single TLS terminator on 127.0.0.1:8444 (with PROXY protocol).
# So our HTTPS vhost listens on 8444, not 443. Plain port 80 redirects
# to HTTPS.

# HTTP → HTTPS redirect. Also handles the certbot ACME path so renewals
# keep working.
server {
    listen 80;
    listen [::]:80;
    server_name oxidb-embedded-django.baltavista.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS terminator behind the public :443 SNI-router.
server {
    listen 127.0.0.1:8444 ssl proxy_protocol;
    server_name oxidb-embedded-django.baltavista.com;

    ssl_certificate     /etc/letsencrypt/live/oxidb-embedded-django.baltavista.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oxidb-embedded-django.baltavista.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Real client IP — request reaches us via the stream-mode SNI
    # router on loopback, then through Cloudflare's edge. Trust the
    # loopback proxy_protocol address; the real IP rides in
    # CF-Connecting-IP from Cloudflare.
    set_real_ip_from 127.0.0.1/32;
    real_ip_header CF-Connecting-IP;

    # Security headers. Django's SecurityMiddleware already emits HSTS,
    # Referrer-Policy, X-Content-Type-Options, X-Frame-Options — we
    # only add what Django doesn't have native support for.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # CSP is emitted per-request by CSPNonceMiddleware in Django
    # (uses a fresh nonce). Don't set it here — would conflict.
    # COOP comes from Django's SecurityMiddleware.

    location / {
        proxy_pass         http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";

        client_max_body_size 12m;
        proxy_read_timeout   60s;
        proxy_send_timeout   60s;
    }
}
