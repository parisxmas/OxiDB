# Everything talks over the internal network. The host is already running eight
# unrelated OxiDB instances and has 6379/5432/8080/27017 taken, so exactly ONE
# port is published — the API — and nothing else can collide.
services:
  oxidb:
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    build:
      context: .
      dockerfile: Dockerfile.oxidb
    environment:
      OXIDB_SQL: "1"
      OXIDB_TSDB: "1"
      OXIDB_DATA: /data
      OXIDB_ADDR: 0.0.0.0:4444
      OXIDB_MQTT_PORT: "1883"
      OXIDB_OXIMEM_PORT: "6379"
      OXIDB_S3_PORT: "9000"
      OXIDB_AUDIT: "1"
      # Auditing every wire command writes ~62 MB/day here. Unrotated that is
      # 22 GB/year — measured, not guessed. Rotate at 32 MB and gzip.
      OXIDB_AUDIT_MAX_BYTES: "33554432"
      OXIDB_AUDIT_COMPRESS: "1"
      OXIDB_IDLE_TIMEOUT: "0"
      # The document WAL now seals + snapshots itself once it reaches this,
      # instead of growing until the process exits. 64 MiB is the default; at
      # this demo's ~130 MB/day that would checkpoint twice a day, so cap it
      # lower and keep the ceiling obvious.
      OXIDB_WAL_CHECKPOINT_BYTES: "16777216"
      # Documents live in an mmap'd file; only a 24 B/doc offset index is
      # resident. RSS no longer scales with the retention window.
      OXIDB_DISK_FIRST: "1"
    volumes:
      - oxidb-data:/data
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost — the alpine image does not resolve the name,
      # and the check silently failed on it.
      test: ["CMD", "nc", "-z", "127.0.0.1", "4444"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    build: { context: .., dockerfile: coldchain/Dockerfile, target: api }
    environment:
      COLDCHAIN_HOST: oxidb
    ports:
      - "127.0.0.1:8123:8080"   # the only published port; nginx proxies to it
    depends_on:
      oxidb: { condition: service_healthy }
    restart: unless-stopped

  ingest:
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    build: { context: .., dockerfile: coldchain/Dockerfile, target: ingest }
    environment:
      COLDCHAIN_HOST: oxidb
      INGEST_SECONDS: "0"          # 0 = run until the container stops
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

  simulator:
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    build: { context: .., dockerfile: coldchain/Dockerfile, target: simulator }
    environment:
      COLDCHAIN_HOST: oxidb
      SIM_SECONDS: "0"
    depends_on:
      ingest: { condition: service_started }
    restart: unless-stopped

volumes:
  oxidb-data:
