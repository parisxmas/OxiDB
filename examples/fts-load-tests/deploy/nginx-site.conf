# nginx site for oxidbftsdemo.baltavista.com.
#
# Architecture (matches the existing baltavista pattern):
#   public :443 ─stream{} ssl_preread─► 127.0.0.1:8444 (default SNI upstream)
# This file lives in /etc/nginx/conf.d/ which is included inside the
# http{} context, so limit_req_zone / limit_conn_zone / map directives
# at the top level are valid here.

# --- Rate limiting zones (keyed by the real client IP, set via
# CF-Connecting-IP below). Each zone holds ~10 MB of state, ~160 k
# unique IPs.
limit_req_zone $binary_remote_addr zone=ftsdemo_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ftsdemo_api:10m     rate=30r/m;
limit_req_zone $binary_remote_addr zone=ftsdemo_upload:10m  rate=10r/m;
# /api/fts-status is polled at ~2 req/s during ingest (frontend progress
# panel) — give it its own bucket so it doesn't burn the general budget.
limit_req_zone $binary_remote_addr zone=ftsdemo_status:10m  rate=240r/m;
limit_conn_zone $binary_remote_addr zone=ftsdemo_conn:10m;

# --- Bot user-agent map. Anything that screams "automation" gets
# rejected on writes. This is best-effort (UAs are spoofable) — pair
# with Cloudflare Bot Fight Mode for real coverage.
map $http_user_agent $ftsdemo_is_bot {
    default                     0;
    ""                          1;   # empty UA → bot
    ~*curl                      1;
    ~*wget                      1;
    ~*python-requests           1;
    ~*python-urllib             1;
    ~*libwww                    1;
    ~*httpclient                1;
    ~*go-http-client            1;
    ~*scrapy                    1;
    ~*ahrefsbot                 1;
    ~*semrushbot                1;
    ~*mj12bot                   1;
    ~*dotbot                    1;
    ~*petalbot                  1;
    ~*bingbot                   1;
    ~*googlebot                 1;
    ~*yandexbot                 1;
    ~*bytespider                1;
    ~*claudebot                 1;
    ~*gptbot                    1;
    ~*chatgpt-user              1;
    ~*cohere-ai                 1;
    ~*perplexitybot             1;
    ~*amazonbot                 1;
    ~*applebot                  1;
    ~*facebookexternalhit       1;
    ~*twitterbot                1;
    ~*headlesschrome            1;
    ~*phantomjs                 1;
}

# --- Plain HTTP — redirect, leaving the ACME challenge accessible so
# certbot --webroot can renew without taking the site down.
server {
    listen 80;
    listen [::]:80;
    server_name oxidbftsdemo.baltavista.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8444 ssl proxy_protocol;
    server_name oxidbftsdemo.baltavista.com;

    ssl_certificate     /etc/letsencrypt/live/oxidbftsdemo.baltavista.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oxidbftsdemo.baltavista.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Trust the local stream relay; the real client IP comes via
    # CF-Connecting-IP because Cloudflare orange-clouds this hostname.
    set_real_ip_from 127.0.0.1/32;
    real_ip_header CF-Connecting-IP;

    # 5 MB upload cap (matches web.py's MAX_UPLOAD_BYTES). Cloudflare's
    # free plan is 100 MB; we stay well under.
    client_max_body_size 5M;
    client_body_timeout 30s;

    # Per-IP connection cap and default rate limit. The api/search
    # and api/upload locations override with stricter limits.
    limit_conn  ftsdemo_conn 10;
    limit_req   zone=ftsdemo_general burst=20 nodelay;
    limit_req_status 429;
    limit_conn_status 429;

    # Method allowlist — drop everything we don't use.
    if ($request_method !~ ^(GET|POST|PUT|HEAD|OPTIONS)$) {
        return 405;
    }

    # --- Security headers (sent on every response).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
    # CSP allows self + the two CDN scripts (mammoth.js / SheetJS) the
    # viewer lazy-loads. 'unsafe-inline' for script-src is required by
    # the inline <script> in index.html — acceptable trade-off for a
    # single-page demo with no third-party JS execution.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Block dotfiles and stray backup / git paths outright.
    location ~ /\. { deny all; }
    location ~ \.(git|env|bak|swp|backup|orig)$ { deny all; }

    # --- /api/search : POST only, stricter rate limit, bots rejected.
    location = /api/search {
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
        if ($ftsdemo_is_bot)                     { return 403; }
        limit_req zone=ftsdemo_api burst=10 nodelay;

        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # --- /api/fts-status, /api/proc-status, /api/stats,
    # /api/uploads-feed : GET, polled by the UI. Same rate-limit
    # bucket — all are cheap read-only snapshots refreshed every few
    # seconds by every open tab.
    location ~ ^/api/(fts-status|proc-status|stats|uploads-feed)$ {
        if ($request_method !~ ^(GET|OPTIONS)$) { return 405; }
        limit_req zone=ftsdemo_status burst=20 nodelay;

        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }

    # --- /api/upload/<filename> : PUT only, very strict rate limit.
    location ~ ^/api/upload/ {
        if ($request_method !~ ^(PUT|OPTIONS)$) { return 405; }
        if ($ftsdemo_is_bot)                    { return 403; }
        limit_req zone=ftsdemo_upload burst=3 nodelay;

        # Stream the body straight through — don't buffer 5 MB on disk.
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Default: index, /api/blob/<key>, /api/text/<key>, /healthz.
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
