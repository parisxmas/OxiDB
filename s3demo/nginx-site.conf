# nginx site for s3demo.baltavista.com.
#
# Architecture: piggy-backs on the existing baltavista stream-SNI
# router. The host's nginx already runs:
#   stream { server { listen 443; ssl_preread on; proxy_pass <map>; } }
# whose default upstream is 127.0.0.1:8444. This file adds a NEW
# server block on the SAME port (8444) keyed by server_name; nginx
# dispatches between baltavista hosts via SNI inside the SSL context.
# No nginx.conf edit is needed — purely additive.
#
# Public flow:
#   client (aws-cli) ─TLS─► Cloudflare ─TLS─► origin :443
#       └─ stream ssl_preread → 127.0.0.1:8444 (proxy_protocol)
#           └─ this server block (matched by SNI) terminates TLS
#               └─ proxy_pass http://127.0.0.1:9000 (oxidb S3)

server {
    listen 80;
    listen [::]:80;
    server_name s3demo.baltavista.com;

    # Keep ACME challenge accessible for cert renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8444 ssl proxy_protocol;
    server_name s3demo.baltavista.com;

    ssl_certificate     /etc/letsencrypt/live/s3demo.baltavista.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3demo.baltavista.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_S3:10m;
    ssl_session_timeout 1d;

    # The stream relay forwards CF-Connecting-IP via PROXY protocol;
    # this picks the real client IP back up for logging and SigV4.
    set_real_ip_from 127.0.0.1/32;
    real_ip_header CF-Connecting-IP;

    # Multipart upload limit. Demo cap of 100 MiB is a balance — large
    # enough for screenshot/PDF tests, small enough to stop accidental
    # 5 GiB AWS-style uploads from filling the disk on this box.
    client_max_body_size 100M;
    client_body_timeout 300s;

    # CRITICAL for SigV4: nginx MUST NOT alter the request body or
    # change request headers that participated in the signature.
    # `proxy_request_buffering off` streams the body; we leave Host
    # untouched (matches what the client signed).
    proxy_request_buffering off;
    proxy_buffering off;

    # No bot-UA blocking here — aws-cli, boto3, and other AWS SDKs
    # send distinctive UAs that would otherwise trip the FTS demo's
    # bot list. S3 clients are not browsers.

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # S3 multipart / large-object timeouts.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }
}
