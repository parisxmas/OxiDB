# Fuzz harness — excluded from the workspace because libfuzzer-sys
# requires nightly Rust and the sanitizer pulls in heavy code-gen the
# normal `cargo build` shouldn't pay for.
#
# Run targets (after `cargo install cargo-fuzz` and `rustup toolchain
# install nightly`):
#
#   cargo +nightly fuzz run wire_deserialize
#   cargo +nightly fuzz run wire_oxiwire
#   cargo +nightly fuzz run wire_resp
#
# See fuzz/README.md for the longer-form playbook.

[package]
name = "oxidb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oxidb-server = { path = "../oxidb-server" }
# Structure-aware fuzzing: derive Arbitrary on a typed grammar so
# libfuzzer mutates *valid* (or near-valid) values instead of raw
# bytes. Far more efficient at exploring the message space.
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
# Reference MsgPack decoder for the msgpack_roundtrip target — the
# encoder under test is OxiDB's own `protocol::value_to_msgpack`;
# decoding via the canonical `rmp_serde` makes any divergence a
# real bug rather than a same-author blind spot.
rmp-serde = "1"
# Reference RESP parser (redis-rs / `redis::parse_redis_value`) for
# the resp_diff_redis differential target. default-features=false to
# avoid pulling in tokio / TLS / num-bigint etc. — the sync byte-
# parser doesn't need them.
redis = { version = "1", default-features = false }

# Prevent this crate from being picked up by the root workspace.
[workspace]

[[bin]]
name = "wire_deserialize"
path = "fuzz_targets/wire_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_oxiwire"
path = "fuzz_targets/wire_oxiwire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_resp"
path = "fuzz_targets/wire_resp.rs"
test = false
doc = false
bench = false

# Structure-aware: OxiWire roundtrip via Arbitrary value tree.
[[bin]]
name = "oxiwire_roundtrip"
path = "fuzz_targets/oxiwire_roundtrip.rs"
test = false
doc = false
bench = false

# Structure-aware: RESP roundtrip via Arbitrary RespValue tree.
[[bin]]
name = "resp_roundtrip"
path = "fuzz_targets/resp_roundtrip.rs"
test = false
doc = false
bench = false

# Structure-aware: MsgPack roundtrip via Arbitrary Value tree.
# Encoder under test: protocol::value_to_msgpack
# Decoder (reference): rmp_serde::from_slice
[[bin]]
name = "msgpack_roundtrip"
path = "fuzz_targets/msgpack_roundtrip.rs"
test = false
doc = false
bench = false

# Cross-implementation differential: OxiDB RESP decoder vs the
# canonical redis-rs parse_redis_value. Mutation-based — libfuzzer
# feeds raw bytes to BOTH parsers, divergence on the both-accept
# case is a finding.
[[bin]]
name = "resp_diff_redis"
path = "fuzz_targets/resp_diff_redis.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
