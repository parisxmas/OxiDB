<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="OxiDB">
  <defs>
    <linearGradient id="oxiBody" x1="30" y1="30" x2="98" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2986e"/>
      <stop offset="0.55" stop-color="#e2784a"/>
      <stop offset="1" stop-color="#b04a1a"/>
    </linearGradient>
    <linearGradient id="oxiOrbit" x1="12" y1="40" x2="116" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2986e"/>
      <stop offset="1" stop-color="#c85a26"/>
    </linearGradient>
  </defs>

  <!-- Oxide electron orbit — the "Oxi" (oxygen) nod, wrapping the store. -->
  <g transform="rotate(-24 64 64)">
    <ellipse cx="64" cy="64" rx="56" ry="22"
             stroke="url(#oxiOrbit)" stroke-width="4.5" opacity="0.9"/>
  </g>

  <!-- Database cylinder — the "DB", in the rust-oxide gradient. -->
  <g stroke="#7c3212" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M38 42 V86 a26 8.6 0 0 0 52 0 V42" fill="url(#oxiBody)"/>
    <ellipse cx="64" cy="42" rx="26" ry="8.6" fill="url(#oxiBody)"/>
    <path d="M38 64 a26 8.6 0 0 0 52 0" fill="none" opacity="0.85"/>
  </g>

  <!-- Electron — a bright node riding the orbit. -->
  <g transform="rotate(-24 64 64)">
    <circle cx="120" cy="64" r="6.5" fill="#f2986e" stroke="#b04a1a" stroke-width="2"/>
  </g>
</svg>
