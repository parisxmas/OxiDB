[package]
name = "oxibase"
version = "0.1.0"
edition = "2024"
description = "OxiBase — the OxiDB control plane: multi-tenant provisioning over the data plane (ADR-0020/0021)"
license-file = "../LICENSE"
repository = "https://github.com/parisxmas/OxiDB"

[[bin]]
name = "oxibase"
path = "src/main.rs"

[dependencies]
oxidb-http = { path = "../oxidb-http" }
oxidb-client = { path = "../oxidb-client" }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.9"
