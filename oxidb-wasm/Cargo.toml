[package]
name = "oxidb-wasm"
version = "0.42.0"
edition = "2024"
description = "OxiDB document database compiled to WebAssembly"
license-file = "../LICENSE"
repository = "https://github.com/parisxmas/OxiDB"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxidb = { path = ".." }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

# Browser APIs for OPFS (Origin Private File System) persistence: dump the DB
# image to a real origin-private file and restore it on the next load.
[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Navigator",
    "WorkerGlobalScope",
    "WorkerNavigator",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "File",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
