[package]
name = "oxidb-wasm"
version = "0.33.1"
edition = "2024"
description = "OxiDB document database compiled to WebAssembly"
license-file = "../LICENSE"
repository = "https://github.com/parisxmas/OxiDB"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxidb = { path = ".." }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
