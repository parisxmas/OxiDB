<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OxiDB WASM Example</title>
</head>
<body>
    <h1>OxiDB WebAssembly Example</h1>
    <pre id="output">Loading WASM...</pre>

    <script type="module">
        // Load from GitHub releases (or use local: '../pkg/oxidb_wasm.js')
        import init, * as oxidb from '../pkg/oxidb_wasm.js';

        const out = document.getElementById('output');
        function log(msg) { out.textContent += '\n' + msg; }

        try {
            // 1. Initialize WASM
            await init();
            oxidb.init();
            out.textContent = 'OxiDB WASM ready!\n';

            // 2. Insert documents
            oxidb.insert('users', JSON.stringify({ name: 'Alice', age: 30, city: 'Berlin' }));
            oxidb.insert('users', JSON.stringify({ name: 'Bob', age: 25, city: 'Tokyo' }));
            oxidb.insert('users', JSON.stringify({ name: 'Charlie', age: 35, city: 'Berlin' }));
            log('Inserted 3 users');

            // 3. Find all
            const all = JSON.parse(oxidb.find('users', '{}'));
            log('\nAll users:\n' + JSON.stringify(all, null, 2));

            // 4. Query with filter
            const berliners = JSON.parse(oxidb.find('users', JSON.stringify({ city: 'Berlin' })));
            log('\nUsers in Berlin:\n' + JSON.stringify(berliners, null, 2));

            // 5. Sorted range query. (There is no oxidb.sql() here: the WASM
            // build exposes the document engine only — the SQL engine needs a
            // filesystem for its WAL and checkpoints, which this target has
            // no notion of.)
            const older = JSON.parse(oxidb.find('users', JSON.stringify({ age: { $gt: 27 } })));
            log('\nAge > 27:\n' + JSON.stringify(older, null, 2));

            // 6. Update
            const updated = oxidb.update('users', JSON.stringify({ name: 'Bob' }), JSON.stringify({ $set: { age: 26 } }));
            log('\nUpdated ' + updated + ' document(s)');

            // 7. Count
            const count = oxidb.count('users', '{}');
            log('Total users: ' + count);

            // 8. Aggregate
            const agg = JSON.parse(oxidb.aggregate('users', JSON.stringify([
                { $group: { _id: '$city', count: { $sum: 1 } } }
            ])));
            log('\nUsers per city:\n' + JSON.stringify(agg, null, 2));

            // 9. Delete
            // `delete` is a JS reserved word, so wasm-bindgen exports it as `_delete`.
            const deleted = oxidb._delete('users', JSON.stringify({ name: 'Charlie' }));
            log('\nDeleted ' + deleted + ' document(s)');

            // 10. Final state
            const final_state = JSON.parse(oxidb.find('users', '{}'));
            log('\nFinal state:\n' + JSON.stringify(final_state, null, 2));

        } catch (e) {
            log('Error: ' + e);
        }
    </script>
</body>
</html>
