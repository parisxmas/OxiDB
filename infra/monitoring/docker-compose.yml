# Local Prometheus + Grafana for watching a live OxiDB server.
#
#   1. Start OxiDB with the metrics endpoint on:  ./run.sh
#   2. Bring up the stack:                        docker compose up -d
#   3. Grafana:    http://localhost:3000  (admin / admin, dashboard auto-loaded)
#      Prometheus: http://localhost:9090
#
# OxiDB itself runs on the HOST (not in compose) so it uses your local
# build; Prometheus scrapes it via host.docker.internal.

name: oxidb-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: oxidb-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d

  grafana:
    image: grafana/grafana:11.2.2
    container_name: oxidb-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
