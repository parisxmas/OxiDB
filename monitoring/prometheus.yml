global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: oxidb
    metrics_path: /metrics
    static_configs:
      # host.docker.internal reaches the OxiDB server running on the host
      # (started by run.sh with OXIDB_HTTP_PORT=14580). Change to a
      # container name + docker network if you run OxiDB in compose too.
      - targets: ["host.docker.internal:14580"]
        labels:
          instance: local-oxidb
