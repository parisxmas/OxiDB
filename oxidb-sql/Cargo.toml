[package]
name = "oxidb-sql"
version = "0.43.0"
edition = "2024"
description = "Standalone SQL engine for OxiDB — separate storage, WAL, and recovery from the document engine (ADR-0010)"
license-file = "../LICENSE"
repository = "https://github.com/parisxmas/OxiDB"

[dependencies]
oxidb-cobra = { path = "../oxidb-cobra" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
memmap2 = "0.9"
thiserror = "2"
sqlparser = { version = "0.59", features = ["visitor"] }
regex = "1"
smallvec = "1"
tar = "0.4"
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
tempfile = "3"
