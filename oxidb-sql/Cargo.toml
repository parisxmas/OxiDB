[package]
name = "oxidb-sql"
version = "0.31.1"
edition = "2024"
description = "Standalone SQL engine for OxiDB — separate storage, WAL, and recovery from the document engine (ADR-0010)"
license = "AGPL-3.0-only"
repository = "https://github.com/parisxmas/OxiDB"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
thiserror = "2"
sqlparser = "0.59"

[dev-dependencies]
tempfile = "3"
