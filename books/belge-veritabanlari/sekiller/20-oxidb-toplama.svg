<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" font-family="Georgia, serif">
  <rect width="720" height="280" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a4fa0"/></marker></defs>
  <text x="360" y="28" font-size="14" font-weight="bold" text-anchor="middle">$facet: tek girdi, paralel alt-boru hatları</text>
  <rect x="290" y="60" width="140" height="44" rx="8" fill="#e8eef7" stroke="#2b6cb0"/><text x="360" y="87" font-size="12" text-anchor="middle">girdi belgeleri</text>
  <g font-size="11" text-anchor="middle">
    <rect x="40" y="150" width="180" height="44" rx="8" fill="#f3eef7" stroke="#7a4fa0"/><text x="130" y="170">"fiyatAralıkları"</text><text x="130" y="186" font-size="9.5">$group → $sort</text>
    <rect x="270" y="150" width="180" height="44" rx="8" fill="#f3eef7" stroke="#7a4fa0"/><text x="360" y="170">"enÇokSatan"</text><text x="360" y="186" font-size="9.5">$sort → $limit</text>
    <rect x="500" y="150" width="180" height="44" rx="8" fill="#f3eef7" stroke="#7a4fa0"/><text x="590" y="170">"toplamSayı"</text><text x="590" y="186" font-size="9.5">$count</text>
  </g>
  <g stroke="#7a4fa0" stroke-width="1.6" marker-end="url(#a)">
    <line x1="320" y1="104" x2="150" y2="148"/><line x1="360" y1="104" x2="360" y2="148"/><line x1="400" y1="104" x2="570" y2="148"/>
  </g>
  <rect x="240" y="225" width="240" height="36" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="360" y="248" font-size="11" text-anchor="middle">tek çıktı belgesi: her facet bir alan</text>
  <g stroke="#3a8a52" stroke-width="1.4"><line x1="130" y1="194" x2="300" y2="225"/><line x1="360" y1="194" x2="360" y2="225"/><line x1="590" y1="194" x2="420" y2="225"/></g>
  <text x="360" y="276" font-size="10.5" text-anchor="middle" fill="#999">Aynı veriyi tek geçişte birden çok açıdan özetler (gösterge panoları için ideal)</text>
</svg>
