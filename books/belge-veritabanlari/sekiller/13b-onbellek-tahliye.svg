<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" font-family="Georgia, serif">
  <rect width="720" height="320" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="28" font-size="14" font-weight="bold" text-anchor="middle">Tahliye: LRU sıralar, CLOCK tek bitlik işaretle ucuza yaklaştırır</text>
  <line x1="300" y1="48" x2="300" y2="315" stroke="#ddd" stroke-dasharray="4"/>
  <text x="150" y="68" font-size="13" font-weight="bold" text-anchor="middle">LRU</text>
  <text x="510" y="68" font-size="13" font-weight="bold" text-anchor="middle">CLOCK</text>
  <!-- LRU: ordered list -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="40" y="90" width="60" height="34" rx="6" fill="#e8f3ea" stroke="#3a8a52"/><text x="70" y="112">en yeni</text>
    <rect x="110" y="90" width="50" height="34" rx="6" fill="#eef0f5" stroke="#555"/><text x="135" y="112">D</text>
    <rect x="170" y="90" width="50" height="34" rx="6" fill="#eef0f5" stroke="#555"/><text x="195" y="112">C</text>
    <rect x="230" y="90" width="60" height="34" rx="6" fill="#fff5f5" stroke="#c0392b"/><text x="260" y="108">en eski</text><text x="260" y="120" font-size="8">→ atılır</text>
  </g>
  <text x="165" y="152" font-size="10.5" text-anchor="middle" fill="#666">Erişimde öğe başa taşınır</text>
  <text x="165" y="170" font-size="10.5" text-anchor="middle" fill="#666">(her dokunuşta sıralama güncellenir)</text>
  <text x="165" y="200" font-size="10.5" text-anchor="middle">Kurban: listenin en sonu</text>
  <text x="165" y="234" font-size="10" text-anchor="middle" fill="#999">+ Yakınlığı doğru ölçer</text>
  <text x="165" y="252" font-size="10" text-anchor="middle" fill="#999">− Erişim başına defter tutma</text>
  <text x="165" y="270" font-size="10" text-anchor="middle" fill="#999">− Büyük tarama önbelleği kirletir</text>
  <!-- CLOCK: ring -->
  <circle cx="500" cy="155" r="62" fill="none" stroke="#bbb" stroke-width="2"/>
  <g font-size="10" text-anchor="middle">
    <circle cx="500" cy="98" r="13" fill="#e8f3ea" stroke="#3a8a52"/><text x="500" y="102">1</text>
    <circle cx="552" cy="135" r="13" fill="#e8f3ea" stroke="#3a8a52"/><text x="552" y="139">1</text>
    <circle cx="540" cy="200" r="13" fill="#eef0f5" stroke="#555"/><text x="540" y="204">0</text>
    <circle cx="460" cy="200" r="13" fill="#eef0f5" stroke="#555"/><text x="460" y="204">0</text>
    <circle cx="448" cy="135" r="13" fill="#e8f3ea" stroke="#3a8a52"/><text x="448" y="139">1</text>
  </g>
  <!-- clock hand -->
  <line x1="500" y1="155" x2="540" y2="187" stroke="#c0392b" stroke-width="2" marker-end="url(#a)"/>
  <text x="500" y="160" font-size="9" text-anchor="middle" fill="#c0392b">ibre</text>
  <text x="510" y="252" font-size="10.5" text-anchor="middle" fill="#666">Erişimde sadece bit = 1</text>
  <text x="510" y="270" font-size="10" text-anchor="middle" fill="#999">İbre: bit 1 ise sıfırla, geç (ikinci şans);</text>
  <text x="510" y="286" font-size="10" text-anchor="middle" fill="#999">bit 0 olan ilk öğeyi at → erişim başına ~0 maliyet</text>
</svg>
