<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" font-family="Georgia, serif">
  <rect width="720" height="270" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="28" font-size="14" font-weight="bold" text-anchor="middle">Güvenlik: arka arkaya dizilen dört kapı</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="20" y="80" width="150" height="56" rx="8" fill="#fdeee0" stroke="#c97b2c"/><text x="95" y="103" font-weight="bold">Kimlik doğrulama</text><text x="95" y="122" font-size="9.5">sen kimsin?</text>
    <rect x="195" y="80" width="150" height="56" rx="8" fill="#fdeee0" stroke="#c97b2c"/><text x="270" y="103" font-weight="bold">Yetkilendirme</text><text x="270" y="122" font-size="9.5">neye iznin var?</text>
    <rect x="370" y="80" width="150" height="56" rx="8" fill="#fdeee0" stroke="#c97b2c"/><text x="445" y="103" font-weight="bold">Şifreleme</text><text x="445" y="122" font-size="9.5">veri okunamasın</text>
    <rect x="545" y="80" width="150" height="56" rx="8" fill="#fdeee0" stroke="#c97b2c"/><text x="620" y="103" font-weight="bold">Denetim</text><text x="620" y="122" font-size="9.5">kim ne yaptı?</text>
  </g>
  <g stroke="#888" stroke-width="1.6" marker-end="url(#a)">
    <line x1="170" y1="108" x2="193" y2="108"/><line x1="345" y1="108" x2="368" y2="108"/><line x1="520" y1="108" x2="543" y2="108"/>
  </g>
  <text x="95" y="170" font-size="10" text-anchor="middle" fill="#666">parola / SCRAM</text>
  <text x="270" y="170" font-size="10" text-anchor="middle" fill="#666">roller (RBAC)</text>
  <text x="445" y="170" font-size="10" text-anchor="middle" fill="#666">diskte + ağda</text>
  <text x="620" y="170" font-size="10" text-anchor="middle" fill="#666">değişmez kayıt</text>
  <text x="360" y="225" font-size="11" text-anchor="middle" fill="#666">Hiçbir katman tek başına yeterli değildir; güvenlik katmanların toplamıdır</text>
  <text x="360" y="248" font-size="10.5" text-anchor="middle" fill="#999">İlk üçü kötüyü durdurur; sonuncusu olanı geriye dönük görünür kılar</text>
</svg>
