<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" font-family="Georgia, serif">
  <rect width="720" height="330" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">Sıkıştırma: canlıları taze dosyaya kopyala, dizini yeniden eşle, takas et</text>

  <!-- trigger condition -->
  <rect x="180" y="42" width="360" height="38" rx="8" fill="#fdeee0" stroke="#c97b2c" stroke-width="2"/>
  <text x="360" y="60" font-size="11" text-anchor="middle" font-weight="bold">Tetik: dosya ≥ asgari_boyut VE ölü_oran ≥ eşik</text>
  <text x="360" y="74" font-size="9.5" text-anchor="middle">ölü_oran = 1 − (canlı_bayt / dosya_boyutu)</text>

  <!-- old file -->
  <text x="110" y="110" font-size="11" text-anchor="middle" font-weight="bold">Eski .bdat (şişmiş)</text>
  <g font-size="9">
    <rect x="50" y="120" width="120" height="18" fill="#cde8d3" stroke="#3a8a52"/><text x="110" y="133" text-anchor="middle">canlı v1→eski</text>
    <rect x="50" y="138" width="120" height="18" fill="#f0d6d0" stroke="#c0392b"/><text x="110" y="151" text-anchor="middle">ÖLÜ</text>
    <rect x="50" y="156" width="120" height="18" fill="#f0d6d0" stroke="#c0392b"/><text x="110" y="169" text-anchor="middle">ÖLÜ</text>
    <rect x="50" y="174" width="120" height="18" fill="#cde8d3" stroke="#3a8a52"/><text x="110" y="187" text-anchor="middle">canlı</text>
    <rect x="50" y="192" width="120" height="18" fill="#f0d6d0" stroke="#c0392b"/><text x="110" y="205" text-anchor="middle">ÖLÜ</text>
    <rect x="50" y="210" width="120" height="18" fill="#cde8d3" stroke="#3a8a52"/><text x="110" y="223" text-anchor="middle">canlı</text>
  </g>

  <!-- exclusive lock note -->
  <rect x="210" y="120" width="160" height="44" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-dasharray="4"/>
  <text x="290" y="139" font-size="10" text-anchor="middle" fill="#c0392b">dışlayıcı yazma kilidi</text>
  <text x="290" y="155" font-size="9.5" text-anchor="middle">okuma/yazma beklerken</text>
  <line x1="170" y1="172" x2="208" y2="150" stroke="#888" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- copy live -->
  <rect x="210" y="178" width="160" height="50" rx="6" fill="#eef0f5" stroke="#555"/>
  <text x="290" y="198" font-size="10" text-anchor="middle">dizini gez → yalnızca</text>
  <text x="290" y="213" font-size="10" text-anchor="middle">canlı kayıtları kopyala</text>
  <line x1="170" y1="200" x2="208" y2="200" stroke="#3a8a52" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- fresh file -->
  <text x="470" y="110" font-size="11" text-anchor="middle" font-weight="bold">Taze .bdat.compact</text>
  <g font-size="9">
    <rect x="410" y="120" width="120" height="18" fill="#cde8d3" stroke="#3a8a52"/><text x="470" y="133" text-anchor="middle">canlı</text>
    <rect x="410" y="138" width="120" height="18" fill="#cde8d3" stroke="#3a8a52"/><text x="470" y="151" text-anchor="middle">canlı</text>
    <rect x="410" y="156" width="120" height="18" fill="#cde8d3" stroke="#3a8a52"/><text x="470" y="169" text-anchor="middle">canlı</text>
  </g>
  <line x1="370" y1="200" x2="408" y2="150" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- atomic swap + remap -->
  <rect x="560" y="120" width="130" height="108" rx="8" fill="#e8f3ea" stroke="#3a8a52"/>
  <text x="625" y="142" font-size="10" text-anchor="middle" font-weight="bold">atomik takas</text>
  <text x="625" y="160" font-size="9.5" text-anchor="middle">rename → canlı</text>
  <text x="625" y="176" font-size="9.5" text-anchor="middle">dizini yeni</text>
  <text x="625" y="190" font-size="9.5" text-anchor="middle">konumlara eşle</text>
  <text x="625" y="208" font-size="9.5" text-anchor="middle">kilidi bırak</text>
  <line x1="530" y1="147" x2="558" y2="160" stroke="#3a8a52" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="360" y="262" font-size="11" text-anchor="middle" fill="#666">İndeksler kimliğe bakar, konuma değil → yeniden yazmaktan etkilenmez, yalnızca kimlik→konum eşlemesi kurulur</text>
  <text x="360" y="288" font-size="10.5" text-anchor="middle" fill="#999">Sıkıştırma sonrası ölü alan sıfırlanır → ölçüt bir süre sağlanmaz → kendini sınırlar</text>
  <text x="360" y="310" font-size="10.5" text-anchor="middle" fill="#999">Belleğe öncelikli kipte ölü alan yoktur; "sıkıştırma" yalnızca güncel anlık görüntüyü diske yazmaktır</text>
</svg>
