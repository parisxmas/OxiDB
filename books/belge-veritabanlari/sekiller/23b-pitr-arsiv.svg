<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" font-family="Georgia, serif">
  <rect width="720" height="320" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="28" font-size="14" font-weight="bold" text-anchor="middle">Zaman-noktasına kurtarma: GSN → mühürlü segment → arşiv → oynatma</text>
  <!-- top row: durable write gets GSN -->
  <g font-size="11" text-anchor="middle">
    <rect x="30" y="58" width="130" height="46" rx="8" fill="#e8eef7" stroke="#2b6cb0"/><text x="95" y="80">dayanıklı yazma</text><text x="95" y="96" font-size="10">(her koleksiyon)</text>
    <rect x="200" y="58" width="120" height="46" rx="8" fill="#fdeee0" stroke="#c97b2c" stroke-width="2"/><text x="260" y="80">GSN ata</text><text x="260" y="96" font-size="10">küresel + saat</text>
    <rect x="360" y="58" width="140" height="46" rx="8" fill="#eef0f5" stroke="#555"/><text x="430" y="80">canlı WAL dolunca</text><text x="430" y="96" font-size="10">mühürle (seal)</text>
    <rect x="540" y="58" width="150" height="46" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="615" y="80">arşivci kopyalar</text><text x="615" y="96" font-size="10">.seg + manifest</text>
  </g>
  <g stroke="#888" stroke-width="1.6" marker-end="url(#a)">
    <line x1="160" y1="81" x2="198" y2="81"/><line x1="320" y1="81" x2="358" y2="81"/><line x1="500" y1="81" x2="538" y2="81"/>
  </g>
  <!-- archive segments strip -->
  <g font-size="10" text-anchor="middle">
    <rect x="120" y="150" width="90" height="34" rx="6" fill="#eaf4ec" stroke="#3a8a52"/><text x="165" y="172">seg 1</text>
    <rect x="220" y="150" width="90" height="34" rx="6" fill="#eaf4ec" stroke="#3a8a52"/><text x="265" y="172">seg 2</text>
    <rect x="320" y="150" width="90" height="34" rx="6" fill="#eaf4ec" stroke="#3a8a52"/><text x="365" y="172">seg 3</text>
    <rect x="420" y="150" width="90" height="34" rx="6" fill="#eaf4ec" stroke="#3a8a52"/><text x="465" y="172">seg 4 …</text>
  </g>
  <text x="80" y="172" font-size="10.5" text-anchor="middle" fill="#666">arşiv:</text>
  <!-- base backup watermark -->
  <rect x="120" y="206" width="160" height="40" rx="8" fill="#e8eef7" stroke="#2b6cb0" stroke-width="2"/><text x="200" y="225" font-size="11" text-anchor="middle">taban yedek</text><text x="200" y="240" font-size="10" text-anchor="middle">su damgası (GSN watermark)</text>
  <!-- replay arrow to target -->
  <rect x="430" y="206" width="180" height="40" rx="8" fill="#fff5f5" stroke="#c0392b"/><text x="520" y="225" font-size="11" text-anchor="middle">hedefe oynat</text><text x="520" y="240" font-size="10" text-anchor="middle">GSN / zaman / en son</text>
  <g stroke="#c0392b" stroke-width="1.6" marker-end="url(#a)"><line x1="280" y1="226" x2="428" y2="226"/></g>
  <text x="355" y="218" font-size="9.5" text-anchor="middle" fill="#c0392b">segmentleri sırayla uygula</text>
  <text x="360" y="288" font-size="10.5" text-anchor="middle" fill="#999">Oynatma, işlem sınırlarına saygılı tutarlı kesim noktasında durur</text>
  <text x="360" y="306" font-size="9.5" text-anchor="middle" fill="#999">Kapalıyken hiçbir maliyeti yoktur</text>
</svg>
