<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" font-family="Georgia, serif">
  <rect width="720" height="290" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">PagedFieldIndex: yazma tamponu + bitişik sıralı dizi</text>
  <!-- write buffer -->
  <text x="150" y="58" font-size="11" text-anchor="middle" fill="#666">yazma tamponu (sırasız, küçük)</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="60" y="66" width="60" height="30" fill="#fdeee0" stroke="#c97b2c"/><text x="90" y="85">+(45,3)</text>
    <rect x="120" y="66" width="60" height="30" fill="#fdeee0" stroke="#c97b2c"/><text x="150" y="85">+(12,9)</text>
    <rect x="180" y="66" width="60" height="30" fill="#fdeee0" stroke="#c97b2c"/><text x="210" y="85">−(45,1)</text>
  </g>
  <text x="150" y="116" font-size="9" text-anchor="middle" fill="#666">eklemeler buraya: O(1), amorti</text>
  <!-- sorted array -->
  <text x="540" y="58" font-size="11" text-anchor="middle" fill="#666">ana dizi: Vec&lt;(değer, id-kümesi)&gt; — sıralı, bitişik</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="380" y="66" width="60" height="30" fill="#e8f3ea" stroke="#3a8a52"/><text x="410" y="85">10→{..}</text>
    <rect x="440" y="66" width="60" height="30" fill="#e8f3ea" stroke="#3a8a52"/><text x="470" y="85">12→{..}</text>
    <rect x="500" y="66" width="60" height="30" fill="#e8f3ea" stroke="#3a8a52"/><text x="530" y="85">30→{..}</text>
    <rect x="560" y="66" width="60" height="30" fill="#e8f3ea" stroke="#3a8a52"/><text x="590" y="85">45→{..}</text>
    <rect x="620" y="66" width="60" height="30" fill="#e8f3ea" stroke="#3a8a52"/><text x="650" y="85">60→{..}</text>
  </g>
  <text x="540" y="116" font-size="9" text-anchor="middle" fill="#666">arama: ikili arama O(log n), ~20 önbellek satırı (1M)</text>
  <!-- merge arrow -->
  <line x1="245" y1="150" x2="475" y2="150" stroke="#888" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="360" y="142" font-size="10.5" text-anchor="middle">tampon dolunca (≈1000) → flush_write_buffer</text>
  <text x="360" y="168" font-size="9.5" text-anchor="middle" fill="#666">tamponu boşalt, sıralı diziye birleştir (insert/remove uygula)</text>
  <!-- disk variant -->
  <rect x="120" y="200" width="480" height="64" rx="10" fill="#eef0f5" stroke="#555"/>
  <text x="360" y="222" font-size="10.5" text-anchor="middle" font-weight="bold">Disk-first kipte (aynı yapı, farklı yer)</text>
  <text x="360" y="240" font-size="10" text-anchor="middle">ana dizi mmap’li .mfidx dosyasında, sayfa sayfa belleğe gelir;</text>
  <text x="360" y="256" font-size="10" text-anchor="middle">bellekte yalnızca küçük yazma tamponu kalır — açılışta yeniden kurulmaz</text>
</svg>
