<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" font-family="Georgia, serif">
  <rect width="720" height="340" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">LSM: bellekte biriktir, sıralı boşalt, seviyeler arası birleştir</text>
  <!-- memtable -->
  <g font-size="11" text-anchor="middle">
    <rect x="40" y="50" width="150" height="46" rx="8" fill="#e8eef7" stroke="#2b6cb0" stroke-width="2"/>
    <text x="115" y="72">memtable (bellek)</text><text x="115" y="88" font-size="9.5">sıralı, hızlı yazma</text>
  </g>
  <text x="210" y="78" font-size="10" text-anchor="middle" fill="#888">dolunca</text>
  <g stroke="#888" stroke-width="1.6" marker-end="url(#a)"><line x1="190" y1="73" x2="252" y2="73"/></g>
  <!-- L0 -->
  <g font-size="10" text-anchor="middle">
    <text x="60" y="135" font-size="11" font-weight="bold">L0</text>
    <rect x="260" y="55" width="64" height="34" rx="4" fill="#e8f3ea" stroke="#3a8a52"/><text x="292" y="76">SSTable</text>
    <rect x="332" y="55" width="64" height="34" rx="4" fill="#e8f3ea" stroke="#3a8a52"/><text x="364" y="76">SSTable</text>
    <rect x="404" y="55" width="64" height="34" rx="4" fill="#e8f3ea" stroke="#3a8a52"/><text x="436" y="76">SSTable</text>
    <text x="560" y="76" font-size="9.5" fill="#888" text-anchor="start">çakışan aralıklar; her biri bloom + fence</text>
  </g>
  <g stroke="#c97b2c" stroke-width="1.6" marker-end="url(#a)"><line x1="364" y1="92" x2="364" y2="128"/></g>
  <text x="430" y="115" font-size="10" text-anchor="middle" fill="#c97b2c">compaction (birleştir + ölüyü ayıkla)</text>
  <!-- L1 -->
  <g font-size="10" text-anchor="middle">
    <text x="60" y="155" font-size="11" font-weight="bold">L1</text>
    <rect x="120" y="135" width="100" height="34" rx="4" fill="#cde8d3" stroke="#3a8a52"/><text x="170" y="156">0–99</text>
    <rect x="226" y="135" width="100" height="34" rx="4" fill="#cde8d3" stroke="#3a8a52"/><text x="276" y="156">100–199</text>
    <rect x="332" y="135" width="100" height="34" rx="4" fill="#cde8d3" stroke="#3a8a52"/><text x="382" y="156">200–299</text>
    <rect x="438" y="135" width="100" height="34" rx="4" fill="#cde8d3" stroke="#3a8a52"/><text x="488" y="156">300–399</text>
    <text x="620" y="156" font-size="9.5" fill="#888" text-anchor="middle">çakışmaz</text>
  </g>
  <!-- L2 bigger -->
  <g font-size="10" text-anchor="middle">
    <text x="60" y="205" font-size="11" font-weight="bold">L2</text>
    <rect x="120" y="185" width="135" height="34" rx="4" fill="#bcdfc4" stroke="#3a8a52"/>
    <rect x="261" y="185" width="135" height="34" rx="4" fill="#bcdfc4" stroke="#3a8a52"/>
    <rect x="402" y="185" width="135" height="34" rx="4" fill="#bcdfc4" stroke="#3a8a52"/>
    <text x="328" y="206">her seviye ~10× daha büyük (leveled)</text>
  </g>
  <!-- read path -->
  <line x1="40" y1="240" x2="680" y2="240" stroke="#ddd"/>
  <text x="360" y="264" font-size="11.5" font-weight="bold" text-anchor="middle">Okuma yolu</text>
  <text x="360" y="285" font-size="10.5" text-anchor="middle" fill="#666">memtable → L0 → L1 → … : her SSTable'da önce bloom filtresi sorulur ("kesinlikle yok" ise atlanır),</text>
  <text x="360" y="302" font-size="10.5" text-anchor="middle" fill="#666">değilse fence pointer'lar doğru bloğu işaret eder; ilk bulunan (en yeni) sürüm yanıttır</text>
  <text x="360" y="324" font-size="10" text-anchor="middle" fill="#999">size-tiered: benzer boylu parçalar biriktir, topluca birleştir → daha az yazma, daha çok yer/okuma büyütmesi</text>
</svg>
