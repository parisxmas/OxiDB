<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" font-family="Georgia, serif">
  <rect width="720" height="340" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">MVCC: her yazma yeni bir sürüm ekler; okuyucu, anlık görüntüsüne uyan sürümü görür</text>
  <!-- version chain -->
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="80" width="150" height="56" rx="8" fill="#eef0f5" stroke="#888"/><text x="135" y="102">sürüm 1</text><text x="135" y="120" font-size="9.5">bakiye=100 · tx@10</text>
    <rect x="285" y="80" width="150" height="56" rx="8" fill="#e8eef7" stroke="#2b6cb0"/><text x="360" y="102">sürüm 2</text><text x="360" y="120" font-size="9.5">bakiye=80 · tx@25</text>
    <rect x="510" y="80" width="150" height="56" rx="8" fill="#e8f3ea" stroke="#3a8a52" stroke-width="2"/><text x="585" y="102">sürüm 3 (en yeni)</text><text x="585" y="120" font-size="9.5">bakiye=130 · tx@40</text>
  </g>
  <g stroke="#888" stroke-width="1.5" marker-end="url(#a)">
    <line x1="210" y1="108" x2="283" y2="108"/>
    <line x1="435" y1="108" x2="508" y2="108"/>
  </g>
  <text x="360" y="160" font-size="10" text-anchor="middle" fill="#999">sürüm zinciri (eskiden yeniye)</text>
  <!-- readers -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="60" y="200" width="180" height="44" rx="8" fill="#fdeee0" stroke="#c97b2c"/><text x="150" y="220">Okuyucu A (anlık@30)</text><text x="150" y="237" font-size="9.5">sürüm 2'yi görür → 80</text>
    <rect x="450" y="200" width="180" height="44" rx="8" fill="#fdeee0" stroke="#c97b2c"/><text x="540" y="220">Okuyucu B (anlık@45)</text><text x="540" y="237" font-size="9.5">sürüm 3'ü görür → 130</text>
  </g>
  <g stroke="#c97b2c" stroke-width="1.4" stroke-dasharray="4" marker-end="url(#a)">
    <line x1="200" y1="200" x2="340" y2="138"/>
    <line x1="540" y1="200" x2="575" y2="138"/>
  </g>
  <line x1="40" y1="270" x2="680" y2="270" stroke="#ddd"/>
  <text x="360" y="294" font-size="10.5" text-anchor="middle" fill="#666">Okuyucu yazıcıyı, yazıcı okuyucuyu bloke etmez: herkes kendi anlık görüntüsüne uyan sürümü okur.</text>
  <text x="360" y="314" font-size="10.5" text-anchor="middle" fill="#666">Bedeli: artık hiçbir aktif anlık görüntünün görmediği eski sürümleri çöp toplama temizler.</text>
</svg>
