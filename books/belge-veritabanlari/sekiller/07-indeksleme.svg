<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" font-family="Georgia, serif">
  <rect width="720" height="300" fill="#fbfbf8"/>
  <text x="180" y="30" font-size="14" font-weight="bold" text-anchor="middle">İndekssiz: tam tarama O(n)</text>
  <text x="540" y="30" font-size="14" font-weight="bold" text-anchor="middle">Sıralı indeks: O(log n) + atlama</text>
  <line x1="360" y1="46" x2="360" y2="290" stroke="#ddd" stroke-dasharray="4"/>
  <g font-size="10" text-anchor="middle">
    <rect x="40" y="70" width="40" height="28" fill="#fde7e1" stroke="#c0392b"/><rect x="85" y="70" width="40" height="28" fill="#fde7e1" stroke="#c0392b"/><rect x="130" y="70" width="40" height="28" fill="#cde8d3" stroke="#3a8a52" stroke-width="2"/><rect x="175" y="70" width="40" height="28" fill="#fde7e1" stroke="#c0392b"/><rect x="220" y="70" width="40" height="28" fill="#fde7e1" stroke="#c0392b"/><rect x="265" y="70" width="40" height="28" fill="#fde7e1" stroke="#c0392b"/>
  </g>
  <text x="180" y="135" font-size="11" text-anchor="middle" fill="#c0392b">her belgeyi tek tek incele</text>
  <text x="180" y="200" font-size="11" text-anchor="middle" fill="#666">yığın büyüdükçe doğrusal yavaşlar</text>
  <!-- right: index map value->ids -->
  <g font-size="11">
    <rect x="400" y="65" width="120" height="120" rx="6" fill="#fff" stroke="#888"/>
    <text x="460" y="58" font-size="10" text-anchor="middle" fill="#666">değer → belge-id'leri</text>
    <text x="412" y="88">"Ada" → {3}</text>
    <text x="412" y="112">"Ali" → {1,7}</text>
    <text x="412" y="136">"Su"  → {2,5,9}</text>
    <text x="412" y="160">"Zoe" → {4}</text>
  </g>
  <rect x="560" y="100" width="120" height="40" rx="6" fill="#cde8d3" stroke="#3a8a52" stroke-width="2"/>
  <text x="620" y="125" font-size="11" text-anchor="middle">"Su" → {2,5,9}</text>
  <line x1="522" y1="130" x2="558" y2="120" stroke="#3a8a52" stroke-width="1.6"/>
  <text x="540" y="215" font-size="11" text-anchor="middle" fill="#3a8a52">sıralı yapı: doğrudan git, aralık için ardışık tara</text>
  <text x="360" y="270" font-size="10.5" text-anchor="middle" fill="#999">İndeks bir ödünleşimdir: hızlı okuma karşılığında her yazmada bakım maliyeti</text>
</svg>
