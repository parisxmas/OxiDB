<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" font-family="Georgia, serif">
  <rect width="720" height="340" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">Bir isteğin iki kapısı ve ortak çekirdek</text>
  <!-- two entry doors -->
  <g font-size="11" text-anchor="middle">
    <rect x="40" y="56" width="180" height="46" rx="8" fill="#e8eef7" stroke="#2b6cb0"/><text x="130" y="78">gömülü çağrı</text><text x="130" y="94" font-size="9.5" fill="#666">doğrudan işlev (FFI / Rust)</text>
    <rect x="500" y="56" width="180" height="46" rx="8" fill="#e8eef7" stroke="#2b6cb0"/><text x="590" y="78">ağ isteği</text><text x="590" y="94" font-size="9.5" fill="#666">uzunluk-önekli ikili protokol</text>
  </g>
  <!-- server filter -->
  <rect x="500" y="124" width="180" height="44" rx="8" fill="#fdeee0" stroke="#c97b2c"/>
  <text x="590" y="142" font-size="10.5" text-anchor="middle">güvenlik süzgeci</text>
  <text x="590" y="158" font-size="9.5" text-anchor="middle" fill="#666">kimlik + rol (RBAC)</text>
  <line x1="590" y1="102" x2="590" y2="122" stroke="#888" stroke-width="1.4" marker-end="url(#a)"/>
  <!-- engine -->
  <rect x="250" y="190" width="220" height="44" rx="8" fill="#eef0f5" stroke="#555"/>
  <text x="360" y="208" font-size="11" text-anchor="middle" font-weight="bold">Motor (OxiDb)</text>
  <text x="360" y="224" font-size="9.5" text-anchor="middle" fill="#666">koleksiyonu bul ve yönlendir</text>
  <line x1="130" y1="102" x2="300" y2="188" stroke="#888" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="590" y1="168" x2="430" y2="188" stroke="#888" stroke-width="1.4" marker-end="url(#a)"/>
  <!-- collection internals -->
  <rect x="120" y="258" width="480" height="62" rx="10" fill="#e8f3ea" stroke="#3a8a52"/>
  <text x="360" y="277" font-size="11" text-anchor="middle" font-weight="bold">Koleksiyon</text>
  <g font-size="9.5" text-anchor="middle" fill="#444">
    <text x="190" y="298">WAL</text><text x="190" y="311">→ depo</text>
    <text x="300" y="298">depolama</text><text x="300" y="311">(.btree/.bdat)</text>
    <text x="410" y="298">indeksler</text><text x="410" y="311">(alan/bileşik)</text>
    <text x="520" y="298">sürüm sayacı</text><text x="520" y="311">(OCC)</text>
  </g>
  <line x1="360" y1="234" x2="360" y2="256" stroke="#888" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="360" y="336" font-size="10" text-anchor="middle" fill="#999">Her iki kapı da aynı çekirdek motora ve aynı koleksiyon mekanizmalarına iner</text>
</svg>
