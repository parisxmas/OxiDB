<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" font-family="Georgia, serif">
  <rect width="720" height="290" fill="#fbfbf8"/>
  <text x="360" y="28" font-size="14" font-weight="bold" text-anchor="middle">Tek çekirdek, birçok yüz</text>
  <ellipse cx="360" cy="150" rx="95" ry="50" fill="#e8f3ea" stroke="#3a8a52" stroke-width="2"/>
  <text x="360" y="148" font-size="13" font-weight="bold" text-anchor="middle">OxiDB çekirdeği</text>
  <text x="360" y="166" font-size="9.5" text-anchor="middle" fill="#666">(Rust)</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="40" y="60" width="120" height="34" rx="6" fill="#e8eef7" stroke="#2b6cb0"/><text x="100" y="82">Gömülü (FFI)</text>
    <rect x="40" y="205" width="120" height="34" rx="6" fill="#e8eef7" stroke="#2b6cb0"/><text x="100" y="227">TCP sunucu</text>
