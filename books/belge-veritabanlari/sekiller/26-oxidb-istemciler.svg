    <line x1="560" y1="80" x2="440" y2="135"/><line x1="560" y1="222" x2="440" y2="165"/>
    <line x1="360" y1="200" x2="360" y2="245"/>
  </g>
  <text x="360" y="288" font-size="10.5" text-anchor="middle" fill="#999">Aynı motor; her istemci ya gömülü çağırır ya da bir tel protokolü konuşur</text>
