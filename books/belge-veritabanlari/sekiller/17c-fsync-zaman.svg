<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" font-family="Georgia, serif">
  <rect width="720" height="280" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">Katı kip: tekil yazma vs grup commit</text>
  <!-- single write -->
  <text x="40" y="62" font-size="11" font-weight="bold">Tekil yazma</text>
  <g font-size="10" text-anchor="middle">
    <rect x="40" y="72" width="100" height="38" rx="6" fill="#e8eef7" stroke="#2b6cb0"/><text x="90" y="95">1 belge</text>
    <rect x="160" y="72" width="100" height="38" rx="6" fill="#fdeee0" stroke="#c97b2c"/><text x="210" y="95">WAL’a yaz</text>
    <rect x="280" y="72" width="130" height="38" rx="6" fill="#fff5f5" stroke="#c0392b"/><text x="345" y="91">tam boşaltma</text><text x="345" y="105" font-size="8.5" fill="#c0392b">~ms (disk dönüşü)</text>
  </g>
  <line x1="140" y1="91" x2="158" y2="91" stroke="#888" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="260" y1="91" x2="278" y2="91" stroke="#888" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="470" y="95" font-size="10" fill="#c0392b">→ belge başına 1 tam boşaltma (pahalı)</text>
  <!-- group commit -->
  <text x="40" y="160" font-size="11" font-weight="bold">Grup commit</text>
  <g font-size="10" text-anchor="middle">
    <rect x="40" y="170" width="100" height="38" rx="6" fill="#e8eef7" stroke="#2b6cb0"/><text x="90" y="189">N belge</text><text x="90" y="202" font-size="8.5" fill="#666">(parti)</text>
    <rect x="160" y="170" width="130" height="38" rx="6" fill="#fdeee0" stroke="#c97b2c"/><text x="225" y="189">hepsini WAL’a</text><text x="225" y="202" font-size="8.5" fill="#666">tek write_all</text>
    <rect x="310" y="170" width="130" height="38" rx="6" fill="#e8f3ea" stroke="#3a8a52"/><text x="375" y="189">TEK boşaltma</text><text x="375" y="202" font-size="8.5" fill="#3a8a52">tüm parti için</text>
  </g>
  <line x1="140" y1="189" x2="158" y2="189" stroke="#888" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="290" y1="189" x2="308" y2="189" stroke="#888" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="470" y="193" font-size="10" fill="#3a8a52">→ boşaltma maliyeti N’e bölünür (amorti)</text>
  <!-- bottom -->
  <rect x="120" y="236" width="480" height="34" rx="8" fill="#eef0f5" stroke="#555"/>
  <text x="360" y="257" font-size="10.5" text-anchor="middle">Sıra: önce WAL+boşaltma (dayanıklı) → sonra veriye uygula → checkpoint’te WAL’ı kırp</text>
</svg>
