  </g>
  <text x="360" y="160" font-size="12" text-anchor="middle">Otomatik tetik: dosya ≥ eşik <tspan font-style="italic">ve</tspan> ölü oran ≥ eşik</text>
  <text x="360" y="185" font-size="11" text-anchor="middle" fill="#666">canlı kayıtlar yeni dosyaya kopyalanır, eski dosya atılır</text>
  <text x="360" y="230" font-size="10.5" text-anchor="middle" fill="#999">Ödünleşim: sıkıştırma anlık I/O ve CPU harcar; ama alanı ve okuma yerelliğini geri verir</text>
