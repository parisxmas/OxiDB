<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" font-family="Georgia, serif">
  <rect width="720" height="300" fill="#fbfbf8"/>
  <text x="180" y="30" font-size="14" font-weight="bold" text-anchor="middle">Yerinde güncelleme (sayfa / B-ağacı)</text>
  <text x="540" y="30" font-size="14" font-weight="bold" text-anchor="middle">Ekle-only (log-yapılı)</text>
  <line x1="360" y1="46" x2="360" y2="290" stroke="#ddd" stroke-dasharray="4"/>
  <!-- left: pages, one overwritten -->
  <g font-size="11" text-anchor="middle">
    <rect x="40" y="70" width="80" height="50" fill="#eef0f5" stroke="#555"/><text x="80" y="100">sayfa 1</text>
    <rect x="140" y="70" width="80" height="50" fill="#fde7e1" stroke="#c0392b" stroke-width="2"/><text x="180" y="100">sayfa 2</text>
    <rect x="240" y="70" width="80" height="50" fill="#eef0f5" stroke="#555"/><text x="280" y="100">sayfa 3</text>
  </g>
  <text x="180" y="150" font-size="11" text-anchor="middle" fill="#c0392b">↻ aynı yer üzerine yaz</text>
  <text x="180" y="200" font-size="11" text-anchor="middle" fill="#666">+ kompakt, rastgele okuma hızlı</text>
  <text x="180" y="222" font-size="11" text-anchor="middle" fill="#666">– yerinde yazma riski, kilit</text>
  <!-- right: append log -->
  <g font-size="10" text-anchor="middle">
    <rect x="400" y="75" width="48" height="40" fill="#e8f3ea" stroke="#3a8a52"/><text x="424" y="100">v1</text>
    <rect x="452" y="75" width="48" height="40" fill="#e8f3ea" stroke="#3a8a52"/><text x="476" y="100">v2</text>
    <rect x="504" y="75" width="48" height="40" fill="#e8f3ea" stroke="#3a8a52"/><text x="528" y="100">v3</text>
    <rect x="556" y="75" width="48" height="40" fill="#cde8d3" stroke="#3a8a52" stroke-width="2"/><text x="580" y="100">v4</text>
    <rect x="608" y="75" width="48" height="40" fill="none" stroke="#bbb" stroke-dasharray="3"/><text x="632" y="100" fill="#aaa">→</text>
  </g>
  <text x="540" y="140" font-size="11" text-anchor="middle" fill="#3a8a52">yalnızca sona eklenir; eski sürüm ölü kalır</text>
  <text x="540" y="200" font-size="11" text-anchor="middle" fill="#666">+ sıralı yazma çok hızlı, basit kurtarma</text>
  <text x="540" y="222" font-size="11" text-anchor="middle" fill="#666">– ölü alan birikir → sıkıştırma gerekir</text>
  <text x="360" y="275" font-size="10.5" text-anchor="middle" fill="#999">Temel ödünleşim: yazma hızı ve basitlik ↔ alan ve okuma yerelliği</text>
</svg>
