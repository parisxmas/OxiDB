<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" font-family="Georgia, serif">
  <rect width="720" height="290" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">Disk-first: kimlik→konum dizini (RAM) + mmap’li .bdat (disk)</text>
  <!-- RAM index -->
  <text x="180" y="56" font-size="11" text-anchor="middle" fill="#666">RAM: scc::HashMap&lt;id → {offset, length}&gt;</text>
  <g font-size="10" text-anchor="middle">
    <rect x="60" y="66" width="240" height="26" fill="#e8f3ea" stroke="#3a8a52"/><text x="180" y="83">id 7 → (offset 0, len 240)</text>
    <rect x="60" y="92" width="240" height="26" fill="#e8f3ea" stroke="#3a8a52"/><text x="180" y="109">id 8 → (offset 245, len 198)</text>
    <rect x="60" y="118" width="240" height="26" fill="#e8f3ea" stroke="#3a8a52"/><text x="180" y="135">id 9 → (offset 448, len 312)</text>
  </g>
  <text x="180" y="166" font-size="9.5" text-anchor="middle" fill="#666">belge başına ~birkaç düzine bayt</text>
  <!-- disk file -->
  <text x="540" y="56" font-size="11" text-anchor="middle" fill="#666">disk: .bdat (mmap)</text>
  <g font-size="9" text-anchor="middle">
    <rect x="420" y="66" width="240" height="34" fill="#eef0f5" stroke="#555"/><text x="540" y="86">[st|len|payload id7]</text>
    <rect x="420" y="100" width="240" height="34" fill="#eef0f5" stroke="#555"/><text x="540" y="120">[st|len|payload id8]</text>
    <rect x="420" y="134" width="240" height="34" fill="#eef0f5" stroke="#555"/><text x="540" y="154">[st|len|payload id9]</text>
  </g>
  <text x="540" y="186" font-size="9.5" text-anchor="middle" fill="#666">işletim sistemi sayfa önbelleği yönetir</text>
  <!-- arrows -->
  <line x1="300" y1="105" x2="418" y2="117" stroke="#888" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="360" y="100" font-size="9" text-anchor="middle" fill="#888">offset</text>
  <!-- bottom note -->
  <rect x="120" y="216" width="480" height="48" rx="8" fill="#fdeee0" stroke="#c97b2c"/>
  <text x="360" y="237" font-size="10.5" text-anchor="middle">Açılışta dizin diskten değil, .bdat’ı tarayarak yeniden kurulur</text>
  <text x="360" y="254" font-size="10.5" text-anchor="middle">(her kayıt kendi kimliğini taşır) — yerleşik bellek veriyle büyümez</text>
</svg>
