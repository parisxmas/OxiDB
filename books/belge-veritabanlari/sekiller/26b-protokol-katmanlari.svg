<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" font-family="Georgia, serif">
  <rect width="720" height="310" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="28" font-size="14" font-weight="bold" text-anchor="middle">Tek çekirdek, çok yüz: erişim katmanları</text>
  <!-- access faces top row -->
  <g font-size="10" text-anchor="middle">
    <rect x="30" y="56" width="120" height="46" rx="8" fill="#e8eef7" stroke="#2b6cb0"/><text x="90" y="76">gömülü (FFI)</text><text x="90" y="92" font-size="9">C ABI · ctypes/cgo/P-Invoke</text>
    <rect x="165" y="56" width="120" height="46" rx="8" fill="#e8eef7" stroke="#2b6cb0"/><text x="225" y="76">OxiWire / JSON</text><text x="225" y="92" font-size="9">uzunluk-önekli TCP</text>
    <rect x="300" y="56" width="120" height="46" rx="8" fill="#f3eef7" stroke="#7a4fa0"/><text x="360" y="76">web yüzü</text><text x="360" y="92" font-size="9">HTTP · WS · JWT · kurallar</text>
    <rect x="435" y="56" width="120" height="46" rx="8" fill="#f3eef7" stroke="#7a4fa0"/><text x="495" y="76">anahtar-değer</text><text x="495" y="92" font-size="9">RESP · sıralı küme · pub/sub</text>
    <rect x="570" y="56" width="120" height="46" rx="8" fill="#f3eef7" stroke="#7a4fa0"/><text x="630" y="76">mesajlaşma</text><text x="630" y="92" font-size="9">MQTT (pub/sub paylaşımlı)</text>
  </g>
  <!-- arrows down to core -->
  <g stroke="#888" stroke-width="1.5" marker-end="url(#a)">
    <line x1="90" y1="102" x2="280" y2="168"/><line x1="225" y1="102" x2="320" y2="168"/><line x1="360" y1="102" x2="360" y2="168"/><line x1="495" y1="102" x2="400" y2="168"/><line x1="630" y1="102" x2="440" y2="168"/>
  </g>
  <!-- core -->
  <rect x="200" y="172" width="320" height="50" rx="10" fill="#fdeee0" stroke="#c97b2c" stroke-width="2"/><text x="360" y="193" font-size="13" font-weight="bold" text-anchor="middle">OxiDB çekirdeği</text><text x="360" y="211" font-size="10" text-anchor="middle">depolama · indeks · sorgu · işlem · dayanıklılık</text>
  <!-- shared data note -->
  <text x="360" y="258" font-size="11" text-anchor="middle" fill="#666">Hangi yüzden girilirse girilsin, ardındaki veri ve mekanizmalar aynıdır</text>
  <text x="360" y="280" font-size="10" text-anchor="middle" fill="#999">Python ile yazılan belge web yüzünden okunur; KV ile konan değer aynı motorun verisidir</text>
  <text x="360" y="299" font-size="9.5" text-anchor="middle" fill="#999">Uyumluluk yüzleri yabancı protokolün "yeterli" altkümesini konuşur — tam taklit değil</text>
</svg>
