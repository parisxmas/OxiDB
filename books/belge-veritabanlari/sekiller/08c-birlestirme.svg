<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" font-family="Georgia, serif">
  <rect width="720" height="340" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">Üç birleştirme algoritması, üç maliyet profili</text>
  <!-- nested loop -->
  <text x="120" y="58" font-size="12" font-weight="bold" text-anchor="middle" fill="#2b6cb0">İç içe döngü</text>
  <g font-size="10" text-anchor="middle">
    <rect x="40" y="72" width="160" height="34" rx="6" fill="#e8eef7" stroke="#2b6cb0"/><text x="120" y="93">her dış satır için</text>
    <rect x="40" y="116" width="160" height="34" rx="6" fill="#e8eef7" stroke="#2b6cb0"/><text x="120" y="137">iç tabloyu tara</text>
  </g>
  <g stroke="#888" stroke-width="1.4" marker-end="url(#a)"><line x1="120" y1="106" x2="120" y2="114"/></g>
  <text x="120" y="172" font-size="10" text-anchor="middle" fill="#666">maliyet ≈ N × M</text>
  <text x="120" y="188" font-size="10" text-anchor="middle" fill="#3a8a52">iç tarafta indeks varsa N × log M</text>
  <!-- hash join -->
  <text x="360" y="58" font-size="12" font-weight="bold" text-anchor="middle" fill="#c97b2c">Hash birleştirme</text>
  <g font-size="10" text-anchor="middle">
    <rect x="280" y="72" width="160" height="34" rx="6" fill="#fdeee0" stroke="#c97b2c"/><text x="360" y="93">küçük tablodan</text>
    <rect x="280" y="116" width="160" height="34" rx="6" fill="#fdeee0" stroke="#c97b2c"/><text x="360" y="137">hash tablosu kur</text>
    <rect x="280" y="160" width="160" height="34" rx="6" fill="#fdeee0" stroke="#c97b2c"/><text x="360" y="181">büyüğü tarayıp ara</text>
  </g>
  <g stroke="#888" stroke-width="1.4" marker-end="url(#a)"><line x1="360" y1="106" x2="360" y2="114"/><line x1="360" y1="150" x2="360" y2="158"/></g>
  <text x="360" y="216" font-size="10" text-anchor="middle" fill="#666">maliyet ≈ N + M (eşitlik koşulu)</text>
  <!-- sort merge -->
  <text x="600" y="58" font-size="12" font-weight="bold" text-anchor="middle" fill="#3a8a52">Sırala-birleştir</text>
  <g font-size="10" text-anchor="middle">
    <rect x="520" y="72" width="160" height="34" rx="6" fill="#e8f3ea" stroke="#3a8a52"/><text x="600" y="93">iki tarafı sırala</text>
    <rect x="520" y="116" width="160" height="34" rx="6" fill="#e8f3ea" stroke="#3a8a52"/><text x="600" y="137">birlikte yürü, eşle</text>
  </g>
  <g stroke="#888" stroke-width="1.4" marker-end="url(#a)"><line x1="600" y1="106" x2="600" y2="114"/></g>
  <text x="600" y="172" font-size="10" text-anchor="middle" fill="#666">maliyet ≈ N log N + M log M</text>
  <text x="600" y="188" font-size="10" text-anchor="middle" fill="#3a8a52">girdi zaten sıralıysa N + M</text>
  <line x1="40" y1="250" x2="680" y2="250" stroke="#ddd"/>
  <text x="360" y="276" font-size="10.5" text-anchor="middle" fill="#666">Hash: eşitlik birleştirmesinde, belleğe sığan tablo varken hızlı. Sırala-birleştir: aralık/sıralı çıktı gerektiğinde.</text>
  <text x="360" y="298" font-size="10.5" text-anchor="middle" fill="#666">İç içe döngü: küçük tablolarda ya da iç tarafta seçici indeks olduğunda. Eniyileyici, kardinalite tahminiyle birini seçer.</text>
</svg>
