<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" font-family="Georgia, serif">
  <rect width="720" height="270" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="28" font-size="14" font-weight="bold" text-anchor="middle">Bayt düzeyinde ön-süzme: eşleşmeyeni çözmeden ele</text>
  <g font-size="11" text-anchor="middle">
    <rect x="30" y="80" width="120" height="50" rx="8" fill="#eef0f5" stroke="#555"/><text x="90" y="100">ham bayt</text><text x="90" y="118" font-size="9.5">(disk/.bdat)</text>
    <rect x="200" y="80" width="150" height="50" rx="8" fill="#fdeee0" stroke="#c97b2c" stroke-width="2"/><text x="275" y="100">bayt taraması</text><text x="275" y="118" font-size="9.5">alan var mı / eşleşir mi?</text>
  </g>
  <g stroke="#888" stroke-width="1.6" marker-end="url(#a)"><line x1="150" y1="105" x2="198" y2="105"/></g>
  <!-- branch -->
  <line x1="350" y1="95" x2="430" y2="70" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="350" y1="115" x2="430" y2="155" stroke="#3a8a52" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="435" y="50" width="240" height="40" rx="8" fill="#fde7e1" stroke="#c0392b"/><text x="555" y="74" font-size="11" text-anchor="middle">eşleşme yok → ATLA (JSON çözme yok)</text>
  <rect x="435" y="140" width="240" height="40" rx="8" fill="#cde8d3" stroke="#3a8a52"/><text x="555" y="164" font-size="11" text-anchor="middle">aday → tam çöz + doğrula</text>
  <text x="360" y="220" font-size="11" text-anchor="middle" fill="#666">Pahalı JSON çözme yalnızca gerçek adaylar için yapılır</text>
  <text x="360" y="244" font-size="10.5" text-anchor="middle" fill="#999">Seçici sorgularda büyük kazanç: işin çoğu hiç başlamaz</text>
</svg>
