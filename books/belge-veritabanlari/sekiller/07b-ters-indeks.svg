<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" font-family="Georgia, serif">
  <rect width="720" height="320" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">Ters indeks: sözcükten, onu içeren belgelerin gönderim listesine</text>
  <!-- documents -->
  <text x="120" y="58" font-size="11" font-weight="bold" text-anchor="middle">Belgeler</text>
  <g font-size="10" text-anchor="middle">
    <rect x="50" y="70" width="140" height="34" rx="5" fill="#eef0f5" stroke="#555"/><text x="120" y="91">B1: "hızlı veritabanı"</text>
    <rect x="50" y="112" width="140" height="34" rx="5" fill="#eef0f5" stroke="#555"/><text x="120" y="133">B2: "veritabanı motoru"</text>
    <rect x="50" y="154" width="140" height="34" rx="5" fill="#eef0f5" stroke="#555"/><text x="120" y="175">B3: "hızlı motor"</text>
  </g>
  <text x="245" y="135" font-size="9.5" text-anchor="middle" fill="#888">parçala +</text>
  <text x="245" y="148" font-size="9.5" text-anchor="middle" fill="#888">ters çevir</text>
  <g stroke="#888" stroke-width="1.4" marker-end="url(#a)"><line x1="195" y1="128" x2="300" y2="128"/></g>
  <!-- inverted index -->
  <text x="500" y="58" font-size="11" font-weight="bold" text-anchor="middle">Ters indeks (terim → gönderim listesi)</text>
  <g font-size="10.5" text-anchor="start">
    <rect x="320" y="72" width="120" height="30" rx="5" fill="#fdeee0" stroke="#c97b2c" stroke-width="2"/><text x="332" y="91">"hızlı"</text>
    <rect x="320" y="110" width="120" height="30" rx="5" fill="#fdeee0" stroke="#c97b2c" stroke-width="2"/><text x="332" y="129">"veritabanı"</text>
    <rect x="320" y="148" width="120" height="30" rx="5" fill="#fdeee0" stroke="#c97b2c" stroke-width="2"/><text x="332" y="167">"motoru"</text>
  </g>
  <g font-size="10" text-anchor="middle">
    <rect x="470" y="72" width="200" height="30" rx="5" fill="#e8f3ea" stroke="#3a8a52"/><text x="570" y="91">B1(tf=1), B3(tf=1)</text>
    <rect x="470" y="110" width="200" height="30" rx="5" fill="#e8f3ea" stroke="#3a8a52"/><text x="570" y="129">B1(tf=1), B2(tf=1)</text>
    <rect x="470" y="148" width="200" height="30" rx="5" fill="#e8f3ea" stroke="#3a8a52"/><text x="570" y="167">B2(tf=1), B3(tf=1)</text>
  </g>
  <g stroke="#c97b2c" stroke-width="1.2" marker-end="url(#a)">
    <line x1="440" y1="87" x2="468" y2="87"/><line x1="440" y1="125" x2="468" y2="125"/><line x1="440" y1="163" x2="468" y2="163"/>
  </g>
  <!-- ranking -->
  <line x1="40" y1="210" x2="680" y2="210" stroke="#ddd"/>
  <text x="360" y="234" font-size="11.5" font-weight="bold" text-anchor="middle">Sıralama sezgisi: TF-IDF → BM25</text>
  <text x="360" y="255" font-size="10.5" text-anchor="middle" fill="#666">tf = terim sıklığı (belgede ne çok geçiyor) ↑ alaka ; idf = ters belge sıklığı (genelde ne nadir) ↑ ayırt edicilik</text>
  <text x="360" y="275" font-size="10.5" text-anchor="middle" fill="#666">BM25 ekler: tf'yi doygunluğa sokar (tekrar eden tf azalan getiri verir) + uzun belgeyi cezalandırır (uzunluk normalizasyonu)</text>
  <text x="360" y="298" font-size="10" text-anchor="middle" fill="#999">Nadir + bu belgede yoğun + kısa belge → en yüksek puan</text>
</svg>
