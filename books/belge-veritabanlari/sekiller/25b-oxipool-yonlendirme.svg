<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" font-family="Georgia, serif">
  <rect width="720" height="330" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">OxiPool yönlendirme: hedefli sorgu ve dağıt-topla</text>
  <line x1="360" y1="40" x2="360" y2="325" stroke="#ddd" stroke-dasharray="4"/>
  <text x="180" y="58" font-size="12" font-weight="bold" text-anchor="middle">Anahtarlı istek → tek parça</text>
  <text x="540" y="58" font-size="12" font-weight="bold" text-anchor="middle">Anahtarsız / toplama → tüm parçalar</text>
  <!-- LEFT: targeted -->
  <g font-size="10" text-anchor="middle">
    <rect x="70" y="74" width="220" height="40" rx="8" fill="#f3eef7" stroke="#7a4fa0" stroke-width="2"/><text x="180" y="90">parça anahtarı değeri</text><text x="180" y="106" font-size="9.5">crc32 → sanal parça → tablo</text>
    <rect x="120" y="150" width="120" height="36" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="180" y="172">shard 2</text>
    <rect x="55" y="210" width="80" height="32" rx="6" fill="#f3f3f3" stroke="#bbb"/><text x="95" y="230" fill="#aaa">shard 1</text>
    <rect x="225" y="210" width="80" height="32" rx="6" fill="#f3f3f3" stroke="#bbb"/><text x="265" y="230" fill="#aaa">shard 3</text>
  </g>
  <g stroke="#7a4fa0" stroke-width="1.8" marker-end="url(#a)"><line x1="180" y1="114" x2="180" y2="148"/></g>
  <text x="180" y="268" font-size="10" text-anchor="middle" fill="#666">yalnızca ait olduğu parçaya gider; ötekilere dokunulmaz</text>
  <!-- RIGHT: scatter-gather -->
  <g font-size="10" text-anchor="middle">
    <rect x="470" y="74" width="140" height="40" rx="8" fill="#f3eef7" stroke="#7a4fa0" stroke-width="2"/><text x="540" y="98">OxiPool</text>
    <rect x="420" y="150" width="76" height="36" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="458" y="172">shard 1</text>
    <rect x="502" y="150" width="76" height="36" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="540" y="172">shard 2</text>
    <rect x="584" y="150" width="76" height="36" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="622" y="172">shard 3</text>
  </g>
  <g stroke="#888" stroke-width="1.5" marker-end="url(#a)"><line x1="515" y1="114" x2="465" y2="148"/><line x1="540" y1="114" x2="540" y2="148"/><line x1="565" y1="114" x2="615" y2="148"/></g>
  <g stroke="#7a4fa0" stroke-width="1.3" stroke-dasharray="3" marker-end="url(#a)"><line x1="458" y1="186" x2="525" y2="218"/><line x1="540" y1="186" x2="540" y2="218"/><line x1="622" y1="186" x2="555" y2="218"/></g>
  <rect x="465" y="220" width="150" height="36" rx="8" fill="#eef0f5" stroke="#555"/><text x="540" y="237" font-size="10" text-anchor="middle">birleştir (merge)</text><text x="540" y="250" font-size="9" text-anchor="middle">sayım topla · belge ekle · agg böl+birleştir</text>
  <text x="540" y="282" font-size="10" text-anchor="middle" fill="#666">parça-yerel evre + birleştirme evresi = tek-düğümle aynı sonuç</text>
</svg>
