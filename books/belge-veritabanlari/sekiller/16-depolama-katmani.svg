<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" font-family="Georgia, serif">
  <rect width="720" height="300" fill="#fbfbf8"/>
  <text x="180" y="28" font-size="14" font-weight="bold" text-anchor="middle">in-RAM (.btree)</text>
  <text x="540" y="28" font-size="14" font-weight="bold" text-anchor="middle">disk-first (.bdat + mmap)</text>
  <line x1="360" y1="44" x2="360" y2="295" stroke="#ddd" stroke-dasharray="4"/>
  <!-- in-ram: all docs in RAM -->
  <rect x="40" y="70" width="280" height="110" rx="10" fill="#e8eef7" stroke="#2b6cb0"/>
  <text x="180" y="62" font-size="11" text-anchor="middle" fill="#666">RAM</text>
  <g font-size="10" text-anchor="middle">
    <rect x="60" y="90" width="56" height="34" fill="#fff" stroke="#2b6cb0"/><text x="88" y="112">belge</text>
    <rect x="124" y="90" width="56" height="34" fill="#fff" stroke="#2b6cb0"/><text x="152" y="112">belge</text>
    <rect x="188" y="90" width="56" height="34" fill="#fff" stroke="#2b6cb0"/><text x="216" y="112">belge</text>
    <rect x="252" y="90" width="56" height="34" fill="#fff" stroke="#2b6cb0"/><text x="280" y="112">belge</text>
  </g>
  <text x="180" y="150" font-size="10.5" text-anchor="middle">tüm belgeler bellekte çözülmüş halde</text>
  <text x="180" y="210" font-size="11" text-anchor="middle" fill="#666">+ en hızlı erişim</text>
  <text x="180" y="230" font-size="11" text-anchor="middle" fill="#666">– RAM'e sığmalı</text>
  <!-- disk-first: id->loc index in RAM, payloads on disk -->
  <rect x="400" y="70" width="280" height="50" rx="10" fill="#e8f3ea" stroke="#3a8a52"/>
  <text x="540" y="90" font-size="10.5" text-anchor="middle">RAM: id → konum (offset) indeksi</text>
  <text x="540" y="108" font-size="9.5" text-anchor="middle" fill="#666">küçük; yalnızca yerler</text>
  <rect x="400" y="140" width="280" height="50" rx="10" fill="#eef0f5" stroke="#555"/>
  <text x="540" y="160" font-size="10.5" text-anchor="middle">disk: .bdat (mmap, ekle-only)</text>
  <text x="540" y="178" font-size="9.5" text-anchor="middle" fill="#666">işletim sistemi sayfa önbelleği yönetir</text>
  <line x1="540" y1="120" x2="540" y2="138" stroke="#888" stroke-width="1.4"/>
  <text x="540" y="210" font-size="11" text-anchor="middle" fill="#666">+ RAM'den büyük veri</text>
  <text x="540" y="230" font-size="11" text-anchor="middle" fill="#666">– erişimde sayfa hatası olabilir</text>
  <text x="360" y="270" font-size="10.5" text-anchor="middle" fill="#999">Per-koleksiyon seçim (.bopts): veri RAM'e sığıyorsa in-RAM, büyükse disk-first</text>
</svg>
