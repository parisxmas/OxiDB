<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" font-family="Georgia, serif">
  <rect width="720" height="300" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="180" y="28" font-size="14" font-weight="bold" text-anchor="middle">Replikasyon (dayanıklılık)</text>
  <text x="540" y="28" font-size="14" font-weight="bold" text-anchor="middle">Sharding (kapasite)</text>
  <line x1="360" y1="44" x2="360" y2="295" stroke="#ddd" stroke-dasharray="4"/>
  <!-- replication leader-follower -->
  <g font-size="11" text-anchor="middle">
    <rect x="120" y="70" width="120" height="44" rx="8" fill="#e8eef7" stroke="#2b6cb0" stroke-width="2"/><text x="180" y="97">Lider</text>
    <rect x="55" y="170" width="105" height="40" rx="8" fill="#eef0f5" stroke="#555"/><text x="107" y="195">Takipçi</text>
    <rect x="200" y="170" width="105" height="40" rx="8" fill="#eef0f5" stroke="#555"/><text x="252" y="195">Takipçi</text>
  </g>
  <g stroke="#888" stroke-width="1.5" marker-end="url(#a)"><line x1="160" y1="114" x2="115" y2="168"/><line x1="200" y1="114" x2="245" y2="168"/></g>
  <text x="180" y="245" font-size="10.5" text-anchor="middle" fill="#666">aynı veriyi çoğalt → kopya = dayanıklılık + okuma ölçeği</text>
  <!-- sharding key->chunks->shards -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="420" y="70" width="200" height="36" rx="8" fill="#f3eef7" stroke="#7a4fa0"/><text x="520" y="93">anahtar → parça (chunk)</text>
    <rect x="420" y="160" width="80" height="50" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="460" y="182">Düğüm A</text><text x="460" y="200" font-size="9">parça 1,2</text>
    <rect x="520" y="160" width="80" height="50" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="560" y="182">Düğüm B</text><text x="560" y="200" font-size="9">parça 3,4</text>
    <rect x="620" y="160" width="60" height="50" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="650" y="182">…</text>
  </g>
  <g stroke="#888" stroke-width="1.5" marker-end="url(#a)"><line x1="490" y1="106" x2="460" y2="158"/><line x1="540" y1="106" x2="560" y2="158"/></g>
  <text x="540" y="245" font-size="10.5" text-anchor="middle" fill="#666">veriyi böl → her düğüm bir dilim = veri + yazma ölçeği</text>
  <text x="360" y="278" font-size="10.5" text-anchor="middle" fill="#999">İkisi birlikte: her shard'ın kendi replika kümesi olur</text>
</svg>
