<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" font-family="Georgia, serif">
  <rect width="720" height="280" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="28" font-size="14" font-weight="bold" text-anchor="middle">Üç fazlı commit + kilitsizliği için sıralı kilitleme</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="40" y="60" width="160" height="50" rx="8" fill="#e8eef7" stroke="#2b6cb0"/><text x="120" y="82">hazırla</text><text x="120" y="100" font-size="9.5">yazmaları tampona al</text>
    <rect x="280" y="60" width="160" height="50" rx="8" fill="#fdeee0" stroke="#c97b2c" stroke-width="2"/><text x="360" y="82">doğrula</text><text x="360" y="100" font-size="9.5">sürüm sayaçları eşleşiyor mu</text>
    <rect x="520" y="60" width="160" height="50" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="600" y="82">uygula</text><text x="600" y="100" font-size="9.5">atomik yaz + sürüm++</text>
  </g>
  <g stroke="#888" stroke-width="1.6" marker-end="url(#a)"><line x1="200" y1="85" x2="278" y2="85"/><line x1="440" y1="85" x2="518" y2="85"/></g>
  <!-- sorted locking -->
  <text x="360" y="160" font-size="12" text-anchor="middle" fill="#666">Birden çok koleksiyon kilitlenirken hep aynı sırada (sıralı küme):</text>
  <g font-size="11" text-anchor="middle">
    <rect x="180" y="180" width="90" height="36" rx="6" fill="#eef0f5" stroke="#555"/><text x="225" y="203">A</text>
    <rect x="315" y="180" width="90" height="36" rx="6" fill="#eef0f5" stroke="#555"/><text x="360" y="203">B</text>
    <rect x="450" y="180" width="90" height="36" rx="6" fill="#eef0f5" stroke="#555"/><text x="495" y="203">C</text>
  </g>
  <g stroke="#3a8a52" stroke-width="1.6" marker-end="url(#a)"><line x1="270" y1="198" x2="313" y2="198"/><line x1="405" y1="198" x2="448" y2="198"/></g>
  <text x="360" y="248" font-size="11" text-anchor="middle" fill="#3a8a52">herkes A→B→C sırasıyla kilitlerse döngüsel bekleme — yani kilitlenme — olmaz</text>
</svg>
