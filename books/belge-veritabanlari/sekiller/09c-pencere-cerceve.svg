<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" font-family="Georgia, serif">
  <rect width="720" height="320" fill="#fbfbf8"/>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">Pencere çerçevesi: her satır, çevresindeki bir pencereden değer türetir</text>
  <text x="360" y="50" font-size="11" text-anchor="middle" fill="#666">Bölümle (bölge) → sırala (tarih) → her satır için çerçeveyi hesapla</text>
  <!-- rows -->
  <g font-size="11" text-anchor="middle">
    <rect x="80" y="80" width="80" height="36" rx="5" fill="#eef0f5" stroke="#888"/><text x="120" y="103">g1 · 100</text>
    <rect x="170" y="80" width="80" height="36" rx="5" fill="#eef0f5" stroke="#888"/><text x="210" y="103">g2 · 140</text>
    <rect x="260" y="80" width="80" height="36" rx="5" fill="#eef0f5" stroke="#888"/><text x="300" y="103">g3 · 90</text>
    <rect x="350" y="80" width="80" height="36" rx="5" fill="#fdeee0" stroke="#c97b2c" stroke-width="2.5"/><text x="390" y="103">g4 · 160</text>
    <rect x="440" y="80" width="80" height="36" rx="5" fill="#eef0f5" stroke="#888"/><text x="480" y="103">g5 · 120</text>
    <rect x="530" y="80" width="80" height="36" rx="5" fill="#eef0f5" stroke="#888"/><text x="570" y="103">g6 · 200</text>
  </g>
  <text x="390" y="73" font-size="10" text-anchor="middle" fill="#c97b2c">geçerli satır</text>
  <!-- cumulative frame (rows from start to current) -->
  <rect x="74" y="74" width="322" height="48" rx="8" fill="none" stroke="#3a8a52" stroke-width="2" stroke-dasharray="5"/>
  <text x="235" y="148" font-size="10.5" text-anchor="middle" fill="#3a8a52">SATIR çerçevesi: baştan geçerli satıra kadar → kümülatif toplam = 490</text>
  <!-- range frame -->
  <rect x="344" y="170" width="172" height="48" rx="8" fill="none" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="5"/>
  <g font-size="11" text-anchor="middle" opacity="0.55">
    <rect x="350" y="176" width="80" height="36" rx="5" fill="#e8eef7" stroke="#2b6cb0"/><text x="390" y="199">g4 · 160</text>
    <rect x="440" y="176" width="80" height="36" rx="5" fill="#e8eef7" stroke="#2b6cb0"/><text x="480" y="199">g5 · 120</text>
  </g>
  <text x="430" y="244" font-size="10.5" text-anchor="middle" fill="#2b6cb0">ARALIK çerçevesi: "değeri geçerli satırınkine yakın" satırlar — sıraya göre değil değere göre</text>
  <line x1="40" y1="266" x2="680" y2="266" stroke="#ddd"/>
  <text x="360" y="290" font-size="10.5" text-anchor="middle" fill="#666">Satır çerçevesi konumla (önceki N satır) tanımlanır; aralık çerçevesi değerle (sıralama anahtarına yakın değerler).</text>
  <text x="360" y="308" font-size="10.5" text-anchor="middle" fill="#666">Gruplama satırları çökertir; pencere fonksiyonu satırı korur, yanına çerçeveden türetilmiş bir sütun ekler.</text>
</svg>
