<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" font-family="Georgia, serif">
  <rect width="720" height="250" fill="#fbfbf8"/>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">.bdat kaydının bayt düzeni (append-only)</text>
  <!-- one record -->
  <g font-size="11" text-anchor="middle">
    <rect x="80" y="60" width="80" height="50" fill="#fdeee0" stroke="#c97b2c"/><text x="120" y="82">status</text><text x="120" y="98" font-size="9" fill="#666">1 bayt</text>
    <rect x="160" y="60" width="110" height="50" fill="#e8eef7" stroke="#2b6cb0"/><text x="215" y="82">length</text><text x="215" y="98" font-size="9" fill="#666">u32 LE (4 bayt)</text>
    <rect x="270" y="60" width="360" height="50" fill="#e8f3ea" stroke="#3a8a52"/><text x="450" y="82">payload</text><text x="450" y="98" font-size="9" fill="#666">(sıkıştırılmış/şifreli olabilir) length bayt</text>
  </g>
  <!-- status detail -->
  <text x="120" y="138" font-size="9.5" text-anchor="middle" fill="#666">0 = canlı · 1 = silinmiş</text>
  <line x1="120" y1="112" x2="120" y2="128" stroke="#c97b2c" stroke-width="1.2"/>
  <!-- soft delete -->
  <rect x="80" y="160" width="550" height="36" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-dasharray="4"/>
  <text x="355" y="183" font-size="10.5" text-anchor="middle" fill="#c0392b">soft-delete: yalnızca status baytı 0→1 çevrilir; gövde yerinde kalır (ölü alan)</text>
  <!-- read offset note -->
  <text x="360" y="222" font-size="10" text-anchor="middle" fill="#999">okuma: dizindeki offset + 5 baytlık başlığı atla → payload’ı oku, çöz</text>
  <text x="360" y="240" font-size="10" text-anchor="middle" fill="#999">payload’ın sıkıştırılıp sıkıştırılmadığı baş baytlardaki sihirli imzadan anlaşılır</text>
</svg>
