<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" font-family="Georgia, serif">
  <rect width="720" height="310" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="180" y="28" font-size="14" font-weight="bold" text-anchor="middle">Raft: çoğunluk onayı</text>
  <text x="540" y="28" font-size="14" font-weight="bold" text-anchor="middle">OxiPool: dağıt-topla</text>
  <line x1="360" y1="44" x2="360" y2="305" stroke="#ddd" stroke-dasharray="4"/>
  <g font-size="11" text-anchor="middle">
    <rect x="120" y="70" width="120" height="40" rx="8" fill="#e8eef7" stroke="#2b6cb0" stroke-width="2"/><text x="180" y="95">Lider</text>
    <rect x="55" y="160" width="100" height="40" rx="8" fill="#cde8d3" stroke="#3a8a52"/><text x="105" y="185">Takipçi ✓</text>
    <rect x="200" y="160" width="100" height="40" rx="8" fill="#cde8d3" stroke="#3a8a52"/><text x="250" y="185">Takipçi ✓</text>
  </g>
  <g stroke="#888" stroke-width="1.5" marker-end="url(#a)"><line x1="160" y1="110" x2="115" y2="158"/><line x1="200" y1="110" x2="245" y2="158"/></g>
  <text x="180" y="235" font-size="11" text-anchor="middle" fill="#3a8a52">çoğunluk (N/2+1) yazınca commit kesinleşir</text>
  <text x="180" y="258" font-size="10.5" text-anchor="middle" fill="#666">azınlık düğüm kaybı veriyi kaybettirmez</text>
  <!-- OxiPool scatter-gather -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="490" y="70" width="100" height="40" rx="8" fill="#f3eef7" stroke="#7a4fa0" stroke-width="2"/><text x="540" y="95">OxiPool</text>
    <rect x="420" y="170" width="80" height="40" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="460" y="195">shard 1</text>
    <rect x="510" y="170" width="80" height="40" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="550" y="195">shard 2</text>
    <rect x="600" y="170" width="70" height="40" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="635" y="195">shard 3</text>
  </g>
  <g stroke="#888" stroke-width="1.5" marker-end="url(#a)"><line x1="510" y1="110" x2="465" y2="168"/><line x1="540" y1="110" x2="548" y2="168"/><line x1="570" y1="110" x2="630" y2="168"/></g>
  <g stroke="#7a4fa0" stroke-width="1.3" stroke-dasharray="3"><line x1="460" y1="210" x2="525" y2="245"/><line x1="550" y1="210" x2="545" y2="245"/><line x1="635" y1="210" x2="565" y2="245"/></g>
  <rect x="470" y="245" width="140" height="34" rx="8" fill="#eef0f5" stroke="#555"/><text x="540" y="267" font-size="10.5" text-anchor="middle">parçalar birleştirilir</text>
  <text x="540" y="297" font-size="10" text-anchor="middle" fill="#999">sorgu shard'lara dağıtılır, sonuç toplanır</text>
