<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" font-family="Georgia, serif">
  <rect width="720" height="320" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="28" font-size="14" font-weight="bold" text-anchor="middle">Yaprak dolunca bölünür ve ayrıcı anahtar üst düğüme yükselir</text>
  <!-- before -->
  <text x="180" y="62" font-size="12" font-weight="bold" text-anchor="middle">Önce: dolu yaprak (28 eklenecek)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="78" width="240" height="40" rx="6" fill="#fde7e1" stroke="#c0392b" stroke-width="2"/>
    <line x1="120" y1="78" x2="120" y2="118" stroke="#c0392b"/>
    <line x1="180" y1="78" x2="180" y2="118" stroke="#c0392b"/>
    <line x1="240" y1="78" x2="240" y2="118" stroke="#c0392b"/>
    <text x="90" y="103">10</text><text x="150" y="103">15</text><text x="210" y="103">23</text><text x="270" y="103">31</text>
  </g>
  <text x="180" y="138" font-size="10" text-anchor="middle" fill="#c0392b">kapasite aşıldı → böl</text>
  <!-- after: parent -->
  <text x="540" y="62" font-size="12" font-weight="bold" text-anchor="middle">Sonra: bölünmüş + yükselen ayrıcı</text>
  <g font-size="11" text-anchor="middle">
    <rect x="490" y="78" width="60" height="36" rx="6" fill="#fdeee0" stroke="#c97b2c" stroke-width="2"/><text x="520" y="101">23</text>
  </g>
  <g font-size="11" text-anchor="middle">
    <rect x="410" y="150" width="110" height="38" rx="6" fill="#e8f3ea" stroke="#3a8a52"/>
    <line x1="447" y1="150" x2="447" y2="188" stroke="#3a8a52"/>
    <line x1="484" y1="150" x2="484" y2="188" stroke="#3a8a52"/>
    <text x="428" y="174">10</text><text x="465" y="174">15</text><text x="502" y="174">23</text>
    <rect x="560" y="150" width="110" height="38" rx="6" fill="#e8f3ea" stroke="#3a8a52"/>
    <line x1="597" y1="150" x2="597" y2="188" stroke="#3a8a52"/>
    <line x1="634" y1="150" x2="634" y2="188" stroke="#3a8a52"/>
    <text x="578" y="174">28</text><text x="615" y="174">31</text>
  </g>
  <g stroke="#888" stroke-width="1.4" marker-end="url(#a)">
    <line x1="510" y1="114" x2="465" y2="148"/><line x1="530" y1="114" x2="610" y2="148"/>
  </g>
  <!-- leaf linked list -->
  <g stroke="#3a8a52" stroke-width="1.4" stroke-dasharray="4" marker-end="url(#a)">
    <line x1="520" y1="170" x2="558" y2="170"/>
  </g>
  <text x="540" y="208" font-size="10" text-anchor="middle" fill="#3a8a52">yapraklar bağlı liste ile yan yana (aralık taraması)</text>
  <!-- bottom note -->
  <line x1="40" y1="240" x2="680" y2="240" stroke="#ddd"/>
  <text x="360" y="266" font-size="11" text-anchor="middle" fill="#666">Dolum oranı ~%50–70: bölme yarıyı yeni sayfaya taşır; ardışık ekleme sağ-uçta %100'e yaklaştırılabilir</text>
  <text x="360" y="290" font-size="11" text-anchor="middle" fill="#666">Yüksek fanout (yüzlerce çocuk) → sığ ağaç → milyonlarca kayıt 3–4 sayfa erişiminde bulunur</text>
</svg>
