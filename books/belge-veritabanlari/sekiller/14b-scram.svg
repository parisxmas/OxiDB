<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" font-family="Georgia, serif">
  <rect width="720" height="340" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="28" font-size="14" font-weight="bold" text-anchor="middle">SCRAM el sıkışması: parola hattan hiç geçmez, iki taraf birbirini doğrular</text>
  <!-- two pillars -->
  <rect x="60" y="55" width="130" height="40" rx="8" fill="#e8eef7" stroke="#2b6cb0" stroke-width="2"/><text x="125" y="80" font-size="12" text-anchor="middle">İstemci</text>
  <rect x="530" y="55" width="130" height="40" rx="8" fill="#e8f3ea" stroke="#3a8a52" stroke-width="2"/><text x="595" y="80" font-size="12" text-anchor="middle">Sunucu</text>
  <line x1="125" y1="95" x2="125" y2="320" stroke="#bbb" stroke-width="1.5"/>
  <line x1="595" y1="95" x2="595" y2="320" stroke="#bbb" stroke-width="1.5"/>
  <!-- messages -->
  <g font-size="11">
    <line x1="125" y1="125" x2="593" y2="125" stroke="#888" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="360" y="118" text-anchor="middle">1) kullanıcı adı + istemci çentiği (nonce)</text>

    <line x1="595" y1="170" x2="127" y2="170" stroke="#888" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="360" y="163" text-anchor="middle">2) tuz + iş faktörü (yineleme) + sunucu çentiği</text>

    <line x1="125" y1="225" x2="593" y2="225" stroke="#c97b2c" stroke-width="1.8" marker-end="url(#a)"/>
    <text x="360" y="207" text-anchor="middle" fill="#c97b2c">3) istemci kanıtı</text>
    <text x="360" y="221" text-anchor="middle" font-size="9.5" fill="#999">(tuz+iş faktörüyle türetilen anahtardan; parola değil)</text>

    <line x1="595" y1="270" x2="127" y2="270" stroke="#7a4fa0" stroke-width="1.8" marker-end="url(#a)"/>
    <text x="360" y="263" text-anchor="middle" fill="#7a4fa0">4) sunucu imzası → karşılıklı doğrulama</text>
  </g>
  <text x="360" y="305" font-size="10.5" text-anchor="middle" fill="#999">Çentikler her oturumda rastgele → eski oturum yeniden oynatılamaz (replay'e dayanıklı)</text>
</svg>
