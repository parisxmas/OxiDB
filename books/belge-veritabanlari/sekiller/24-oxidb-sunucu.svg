<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" font-family="Georgia, serif">
  <rect width="720" height="250" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="28" font-size="14" font-weight="bold" text-anchor="middle">Bir isteğin sunucudan geçişi (OxiWire)</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="20" y="80" width="100" height="50" rx="8" fill="#e8eef7" stroke="#2b6cb0"/><text x="70" y="100">çerçeve çöz</text><text x="70" y="116" font-size="9">uzunluk + JSON</text>
    <rect x="135" y="80" width="100" height="50" rx="8" fill="#fdeee0" stroke="#c97b2c"/><text x="185" y="100">kimlik</text><text x="185" y="116" font-size="9">SCRAM</text>
    <rect x="250" y="80" width="100" height="50" rx="8" fill="#fdeee0" stroke="#c97b2c"/><text x="300" y="100">RBAC</text><text x="300" y="116" font-size="9">rol denetimi</text>
    <rect x="365" y="80" width="100" height="50" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="415" y="100">motor</text><text x="415" y="116" font-size="9">işlemi yürüt</text>
    <rect x="480" y="80" width="100" height="50" rx="8" fill="#eef0f5" stroke="#555"/><text x="530" y="100">denetim</text><text x="530" y="116" font-size="9">kaydı yaz</text>
    <rect x="595" y="80" width="100" height="50" rx="8" fill="#e8eef7" stroke="#2b6cb0"/><text x="645" y="100">yanıt</text><text x="645" y="116" font-size="9">çerçevele</text>
  </g>
  <g stroke="#888" stroke-width="1.5" marker-end="url(#a)">
    <line x1="120" y1="105" x2="133" y2="105"/><line x1="235" y1="105" x2="248" y2="105"/><line x1="350" y1="105" x2="363" y2="105"/><line x1="465" y1="105" x2="478" y2="105"/><line x1="580" y1="105" x2="593" y2="105"/>
  </g>
  <text x="360" y="180" font-size="11" text-anchor="middle" fill="#666">Aynı çekirdek motor; sunucu yalnızca ağ, kimlik, yetki ve denetim katmanını ekler</text>
  <text x="360" y="210" font-size="10.5" text-anchor="middle" fill="#999">Gömülü kullanımda bu zincir kısalır: doğrudan motora çağrı</text>
</svg>
