  <text x="615" y="195" font-size="10" text-anchor="middle" fill="#666">liste</text>
  <text x="360" y="290" font-size="10.5" text-anchor="middle" fill="#999">Kendini tanımlayan veri: alan adları değerle birlikte taşınır (JSON yapısı)</text>
