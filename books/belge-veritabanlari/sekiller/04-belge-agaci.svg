    <rect x="460" y="232" width="90" height="30" rx="5" fill="#fff" stroke="#2b6cb0"/><text x="505" y="252" font-size="11">posta</text>
    <rect x="545" y="232" width="60" height="30" rx="5" fill="#fff" stroke="#7a4fa0"/><text x="575" y="252" font-size="11">"yön"</text>
    <rect x="612" y="232" width="60" height="30" rx="5" fill="#fff" stroke="#7a4fa0"/><text x="642" y="252" font-size="11">"ed"</text>
