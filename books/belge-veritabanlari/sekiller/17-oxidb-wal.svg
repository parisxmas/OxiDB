<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" font-family="Georgia, serif">
  <rect width="720" height="290" fill="#fbfbf8"/>
  <text x="180" y="28" font-size="14" font-weight="bold" text-anchor="middle">Katı (strict) senkronizasyon</text>
  <text x="540" y="28" font-size="14" font-weight="bold" text-anchor="middle">Gevşek (lazy) + grup commit</text>
  <line x1="360" y1="44" x2="360" y2="285" stroke="#ddd" stroke-dasharray="4"/>
  <!-- strict: each commit fsync -->
  <g font-size="10" text-anchor="middle">
    <rect x="40" y="80" width="60" height="34" fill="#e8eef7" stroke="#2b6cb0"/><text x="70" y="102">commit</text>
    <rect x="120" y="80" width="60" height="34" fill="#fde7e1" stroke="#c0392b"/><text x="150" y="102">fsync</text>
    <rect x="200" y="80" width="60" height="34" fill="#e8eef7" stroke="#2b6cb0"/><text x="230" y="102">commit</text>
    <rect x="280" y="80" width="40" height="34" fill="#fde7e1" stroke="#c0392b"/><text x="300" y="102">fsync</text>
  </g>
  <text x="180" y="150" font-size="11" text-anchor="middle" fill="#c0392b">her commit kendi fsync'ini bekler</text>
  <text x="180" y="180" font-size="11" text-anchor="middle" fill="#666">en güçlü dayanıklılık · en yavaş</text>
  <text x="180" y="200" font-size="10" text-anchor="middle" fill="#999">(macOS'ta F_FULLFSYNC)</text>
  <!-- lazy/group: many commits, one fsync -->
  <g font-size="10" text-anchor="middle">
    <rect x="400" y="80" width="46" height="34" fill="#e8f3ea" stroke="#3a8a52"/><text x="423" y="102">c1</text>
    <rect x="450" y="80" width="46" height="34" fill="#e8f3ea" stroke="#3a8a52"/><text x="473" y="102">c2</text>
    <rect x="500" y="80" width="46" height="34" fill="#e8f3ea" stroke="#3a8a52"/><text x="523" y="102">c3</text>
    <rect x="560" y="80" width="80" height="34" fill="#fdeee0" stroke="#c97b2c" stroke-width="2"/><text x="600" y="102">tek fsync</text>
  </g>
  <path d="M423,114 q90,30 175,2" fill="none" stroke="#c97b2c" stroke-width="1.4"/>
  <text x="540" y="155" font-size="11" text-anchor="middle" fill="#c97b2c">çok commit tek fsync'te toplanır</text>
  <text x="540" y="180" font-size="11" text-anchor="middle" fill="#666">çok daha hızlı · küçük pencere riski</text>
  <text x="360" y="250" font-size="11" text-anchor="middle" fill="#666">Kurtarma her iki kipte de WAL'ı oynatır; base yedek + segment tekrarı (PITR)</text>
  <text x="360" y="272" font-size="10.5" text-anchor="middle" fill="#999">Seçim: ne kadar veri kaybını tolere edersin? (dayanıklılık ↔ gecikme)</text>
</svg>
