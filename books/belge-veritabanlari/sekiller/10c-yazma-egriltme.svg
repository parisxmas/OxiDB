<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" font-family="Georgia, serif">
  <rect width="720" height="330" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">Yazma eğriltme: iki işlem ayrı kayıtlara yazar, ama ortak bir kuralı birlikte bozar</text>
  <text x="360" y="50" font-size="11" text-anchor="middle" fill="#666">Kural: en az bir doktor nöbette kalmalı. Başlangıç: Ali ve Ayşe nöbette.</text>
  <!-- TX1 -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="50" y="80" width="280" height="44" rx="8" fill="#e8eef7" stroke="#2b6cb0"/><text x="190" y="100">İşlem 1: anlık görüntü → "Ayşe de nöbette"</text><text x="190" y="118" font-size="9.5">kural sağlanıyor sanır → Ali'yi izne çıkarır</text>
    <rect x="390" y="80" width="280" height="44" rx="8" fill="#fdeee0" stroke="#c97b2c"/><text x="530" y="100">İşlem 2: anlık görüntü → "Ali de nöbette"</text><text x="530" y="118" font-size="9.5">kural sağlanıyor sanır → Ayşe'yi izne çıkarır</text>
  </g>
  <g font-size="10.5" text-anchor="middle">
    <rect x="50" y="150" width="280" height="34" rx="8" fill="#e8eef7" stroke="#2b6cb0"/><text x="190" y="172">commit ✓ (Ali izinli)</text>
    <rect x="390" y="150" width="280" height="34" rx="8" fill="#fdeee0" stroke="#c97b2c"/><text x="530" y="172">commit ✓ (Ayşe izinli)</text>
  </g>
  <g stroke="#888" stroke-width="1.4" marker-end="url(#a)">
    <line x1="190" y1="124" x2="190" y2="148"/>
    <line x1="530" y1="124" x2="530" y2="148"/>
  </g>
  <rect x="180" y="208" width="360" height="48" rx="10" fill="#fff5f5" stroke="#c0392b" stroke-width="2"/>
  <text x="360" y="230" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Sonuç: kimse nöbette değil — kural ihlal edildi</text>
  <text x="360" y="248" font-size="10" text-anchor="middle" fill="#c0392b">Hiçbir işlem ötekinin yazdığını okumadı; yine de birlikte tutarsızlık ürettiler</text>
  <line x1="40" y1="278" x2="680" y2="278" stroke="#ddd"/>
  <text x="360" y="300" font-size="10.5" text-anchor="middle" fill="#666">Anlık görüntü yalıtımı kayıp güncellemeyi önler ama yazma eğriltmeyi önlemez; bunu yakalamak için SSI okuma-yazma bağımlılıklarını izler.</text>
</svg>
