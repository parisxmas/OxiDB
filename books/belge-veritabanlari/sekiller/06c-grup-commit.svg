<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" font-family="Georgia, serif">
  <rect width="720" height="300" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">Grup commit: bekleyen birçok işlemi tek fsync ile dayanıklı kıl</text>
  <!-- left: per-commit fsync -->
  <text x="180" y="58" font-size="12" font-weight="bold" text-anchor="middle">Her commit'e ayrı fsync</text>
  <g font-size="10" text-anchor="middle">
    <rect x="40" y="75" width="46" height="32" rx="5" fill="#e8eef7" stroke="#2b6cb0"/><text x="63" y="96">T1</text>
    <rect x="92" y="75" width="60" height="32" rx="5" fill="#fde7e1" stroke="#c0392b"/><text x="122" y="96">fsync</text>
    <rect x="158" y="75" width="46" height="32" rx="5" fill="#e8eef7" stroke="#2b6cb0"/><text x="181" y="96">T2</text>
    <rect x="210" y="75" width="60" height="32" rx="5" fill="#fde7e1" stroke="#c0392b"/><text x="240" y="96">fsync</text>
    <rect x="276" y="75" width="46" height="32" rx="5" fill="#e8eef7" stroke="#2b6cb0"/><text x="299" y="96">T3</text>
  </g>
  <text x="180" y="130" font-size="10.5" text-anchor="middle" fill="#c0392b">3 işlem = 3 fsync (her biri ~ms)</text>
  <line x1="360" y1="50" x2="360" y2="260" stroke="#ddd" stroke-dasharray="4"/>
  <!-- right: group commit -->
  <text x="540" y="58" font-size="12" font-weight="bold" text-anchor="middle">Grup commit</text>
  <g font-size="10" text-anchor="middle">
    <rect x="400" y="75" width="46" height="32" rx="5" fill="#e8eef7" stroke="#2b6cb0"/><text x="423" y="96">T1</text>
    <rect x="450" y="75" width="46" height="32" rx="5" fill="#e8eef7" stroke="#2b6cb0"/><text x="473" y="96">T2</text>
    <rect x="500" y="75" width="46" height="32" rx="5" fill="#e8eef7" stroke="#2b6cb0"/><text x="523" y="96">T3</text>
    <rect x="560" y="75" width="110" height="32" rx="5" fill="#e8f3ea" stroke="#3a8a52" stroke-width="2"/><text x="615" y="96">tek fsync ✓</text>
  </g>
  <g stroke="#888" stroke-width="1.4" marker-end="url(#a)">
    <line x1="446" y1="91" x2="498" y2="91"/><line x1="546" y1="91" x2="558" y2="91"/>
  </g>
  <text x="540" y="130" font-size="10.5" text-anchor="middle" fill="#3a8a52">3 işlem = 1 fsync (verim ×3)</text>
  <line x1="40" y1="170" x2="680" y2="170" stroke="#ddd"/>
  <text x="360" y="196" font-size="11" text-anchor="middle" fill="#666">Bir fsync, ister 1 ister 100 değişikliği boşaltsın, kabaca aynı süreyi alır:</text>
  <text x="360" y="216" font-size="11" text-anchor="middle" fill="#666">çok sayıda commit'i tek boşaltmaya toplamak, dayanıklılıktan ödün vermeden verimi katlar</text>
  <text x="360" y="244" font-size="10.5" text-anchor="middle" fill="#999">Bedel: küçük bir gecikme — grubu toplamak için birkaç bekleyen işlemin birikmesi beklenir</text>
</svg>
