<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" font-family="Georgia, serif">
  <rect width="720" height="340" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">Sürüm doğrulama: okuduğun sürüm hâlâ aynı mı?</text>

  <!-- timeline T1 -->
  <text x="60" y="62" font-size="11.5" font-weight="bold" fill="#2b6cb0">İşlem T1</text>
  <rect x="40" y="72" width="170" height="40" rx="6" fill="#e8eef7" stroke="#2b6cb0"/>
  <text x="125" y="90" font-size="10.5" text-anchor="middle">belge X'i oku</text>
  <text x="125" y="105" font-size="10.5" text-anchor="middle">sürüm=7 hatırla</text>

  <rect x="40" y="132" width="170" height="40" rx="6" fill="#e8eef7" stroke="#2b6cb0"/>
  <text x="125" y="150" font-size="10.5" text-anchor="middle">değişikliği TAMPONLA</text>
  <text x="125" y="165" font-size="10.5" text-anchor="middle">(depoya inmez)</text>

  <!-- T2 interferes -->
  <text x="510" y="62" font-size="11.5" font-weight="bold" fill="#c0392b">İşlem T2 (araya girer)</text>
  <rect x="470" y="72" width="200" height="40" rx="6" fill="#fde7e1" stroke="#c0392b"/>
  <text x="570" y="90" font-size="10.5" text-anchor="middle">X'i değiştirir + commit</text>
  <text x="570" y="105" font-size="10.5" text-anchor="middle">X.sürüm: 7 → 8</text>

  <!-- commit lock barrier -->
  <rect x="250" y="190" width="220" height="34" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-dasharray="4"/>
  <text x="360" y="211" font-size="10.5" text-anchor="middle" fill="#c0392b">commit_lock: doğrula→uygula tek seferde</text>
  <line x1="125" y1="172" x2="300" y2="188" stroke="#888" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- validation -->
  <rect x="220" y="240" width="280" height="40" rx="6" fill="#fdeee0" stroke="#c97b2c" stroke-width="2"/>
  <text x="360" y="258" font-size="11" text-anchor="middle" font-weight="bold">DOĞRULA: okuma kümesindeki her sürüm</text>
  <text x="360" y="273" font-size="10.5" text-anchor="middle">hatırlanan (7) =? güncel (8)</text>
  <line x1="360" y1="224" x2="360" y2="238" stroke="#888" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- two outcomes -->
  <line x1="300" y1="280" x2="200" y2="306" stroke="#3a8a52" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="420" y1="280" x2="540" y2="306" stroke="#c0392b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="40" y="300" width="300" height="32" rx="6" fill="#cde8d3" stroke="#3a8a52"/>
  <text x="190" y="320" font-size="10.5" text-anchor="middle">eşit → UYGULA, sürümü artır, WAL'a yaz</text>
  <rect x="380" y="300" width="300" height="32" rx="6" fill="#fde7e1" stroke="#c0392b"/>
  <text x="530" y="320" font-size="10.5" text-anchor="middle">farklı → ÇATIŞMA → iptal, baştan dene</text>
</svg>
