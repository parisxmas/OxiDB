<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" font-family="Georgia, serif">
  <rect width="760" height="560" fill="#fbfbf8"/>
  <text x="380" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">OxiDB — Katmanlı Mimari ve İstek Akışı</text>

  <!-- defs: arrow -->
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <!-- İstemci -->
  <rect x="60" y="70" width="200" height="50" rx="8" fill="#e8eef7" stroke="#2b6cb0"/>
  <text x="160" y="100" font-size="15" text-anchor="middle">İstemci (Python/Go/.NET/JS)</text>

  <!-- Sunucu katmanı -->
  <rect x="40" y="150" width="680" height="86" rx="10" fill="#fff" stroke="#999"/>
  <text x="56" y="172" font-size="13" fill="#666">Sunucu katmanı (OxiWire)</text>
  <rect x="60" y="184" width="150" height="40" rx="6" fill="#fdeee0" stroke="#c97b2c"/>
  <text x="135" y="209" font-size="13" text-anchor="middle">Kimlik doğrulama</text>
  <rect x="225" y="184" width="120" height="40" rx="6" fill="#fdeee0" stroke="#c97b2c"/>
  <text x="285" y="209" font-size="13" text-anchor="middle">RBAC geçidi</text>
  <rect x="360" y="184" width="100" height="40" rx="6" fill="#fdeee0" stroke="#c97b2c"/>
  <text x="410" y="209" font-size="13" text-anchor="middle">TLS</text>
  <rect x="475" y="184" width="120" height="40" rx="6" fill="#fdeee0" stroke="#c97b2c"/>
  <text x="535" y="209" font-size="13" text-anchor="middle">Denetim</text>

  <!-- Motor -->
  <rect x="230" y="266" width="300" height="46" rx="8" fill="#e8f3ea" stroke="#3a8a52"/>
  <text x="380" y="294" font-size="15" text-anchor="middle">Motor — koleksiyonu bul (per-collection kilit)</text>

  <!-- Koleksiyon -->
  <rect x="40" y="342" width="680" height="150" rx="10" fill="#fff" stroke="#999"/>
  <text x="56" y="364" font-size="13" fill="#666">Koleksiyon</text>

  <rect x="60" y="378" width="200" height="44" rx="6" fill="#eef0f5" stroke="#555"/>
  <text x="160" y="405" font-size="13" text-anchor="middle">WAL (önce niyeti yaz)</text>

  <rect x="280" y="378" width="200" height="44" rx="6" fill="#eef0f5" stroke="#555"/>
  <text x="380" y="399" font-size="13" text-anchor="middle">Depolama</text>
  <text x="380" y="415" font-size="11" text-anchor="middle" fill="#666">in-RAM / disk-first (.bdat)</text>

  <rect x="500" y="378" width="200" height="44" rx="6" fill="#eef0f5" stroke="#555"/>
  <text x="600" y="399" font-size="13" text-anchor="middle">İndeksler</text>
  <text x="600" y="415" font-size="11" text-anchor="middle" fill="#666">alan / bileşik / ters</text>

  <rect x="60" y="436" width="640" height="40" rx="6" fill="#f3eef7" stroke="#7a4fa0"/>
  <text x="380" y="461" font-size="13" text-anchor="middle">Sorgu &amp; Toplama motoru — bayt düzeyinde süzme · pipeline · OCC işlemler</text>

  <!-- arrows -->
  <line x1="160" y1="120" x2="160" y2="150" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="236" x2="380" y2="266" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="312" x2="380" y2="342" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a)"/>

  <text x="700" y="528" font-size="11" text-anchor="end" fill="#999">örnek: elle yazılmış SVG — bağımlılıksız, PDF'e gömülebilir</text>
</svg>
