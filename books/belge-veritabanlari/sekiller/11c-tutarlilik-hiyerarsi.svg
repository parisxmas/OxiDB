<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" font-family="Georgia, serif">
  <rect width="720" height="360" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">Tutarlılık modelleri hiyerarşisi: yukarısı daha güçlü ve daha pahalı</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="230" y="50" width="260" height="40" rx="8" fill="#fde7e1" stroke="#c0392b" stroke-width="2"/><text x="360" y="68">Doğrusallaştırılabilirlik</text><text x="360" y="83" font-size="9.5">gerçek-zaman sırası + tek kopya yanılsaması</text>
    <rect x="230" y="118" width="260" height="40" rx="8" fill="#fdeee0" stroke="#c97b2c" stroke-width="2"/><text x="360" y="136">Ardışık tutarlılık</text><text x="360" y="151" font-size="9.5">ortak bir sıra, ama gerçek-zaman şart değil</text>
    <rect x="230" y="186" width="260" height="40" rx="8" fill="#e8eef7" stroke="#2b6cb0"/><text x="360" y="204">Nedensel tutarlılık</text><text x="360" y="219" font-size="9.5">neden-sonuç ilişkili olaylar sıralı görünür</text>
    <rect x="200" y="254" width="320" height="40" rx="8" fill="#eef0f5" stroke="#888"/><text x="360" y="272">Oturum güvenceleri (kendi-yazdığını-oku, tekdüze okuma)</text><text x="360" y="287" font-size="9.5">tek bir istemcinin kendi deneyimi tutarlı</text>
    <rect x="230" y="312" width="260" height="36" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="360" y="334">Nihai tutarlılık</text>
  </g>
  <g stroke="#888" stroke-width="1.5" marker-end="url(#a)">
    <line x1="360" y1="118" x2="360" y2="92"/>
    <line x1="360" y1="186" x2="360" y2="160"/>
    <line x1="360" y1="254" x2="360" y2="228"/>
    <line x1="360" y1="312" x2="360" y2="296"/>
  </g>
  <text x="150" y="70" font-size="10" text-anchor="middle" fill="#c0392b">güçlü</text>
  <text x="150" y="84" font-size="10" text-anchor="middle" fill="#c0392b">pahalı</text>
  <text x="570" y="330" font-size="10" text-anchor="middle" fill="#3a8a52">gevşek</text>
  <text x="570" y="344" font-size="10" text-anchor="middle" fill="#3a8a52">hızlı · ucuz</text>
  <text x="155" y="200" font-size="9.5" text-anchor="middle" fill="#999">↑ daha çok</text>
  <text x="155" y="214" font-size="9.5" text-anchor="middle" fill="#999">koordinasyon</text>
</svg>
