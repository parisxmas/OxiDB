<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" font-family="Georgia, serif">
  <rect width="720" height="270" fill="#fbfbf8"/>
  <text x="360" y="28" font-size="14" font-weight="bold" text-anchor="middle">Aynı çekirdek motor üstünde dört ek yüzey</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="40" y="60" width="150" height="56" rx="8" fill="#f3eef7" stroke="#7a4fa0"/><text x="115" y="83">Tam metin arama</text><text x="115" y="101" font-size="9.5">TF-IDF, arka iş parçacığı</text>
    <rect x="210" y="60" width="150" height="56" rx="8" fill="#e8eef7" stroke="#2b6cb0"/><text x="285" y="83">Blob depolama</text><text x="285" y="101" font-size="9.5">S3 tarzı kova, CRC32</text>
    <rect x="380" y="60" width="150" height="56" rx="8" fill="#fdeee0" stroke="#c97b2c"/><text x="455" y="83">Şifreleme</text><text x="455" y="101" font-size="9.5">depolama katmanında AES-GCM</text>
