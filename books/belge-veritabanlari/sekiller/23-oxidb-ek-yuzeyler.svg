  </g>
  <g stroke="#888" stroke-width="1.4"><line x1="115" y1="116" x2="300" y2="160"/><line x1="285" y1="116" x2="340" y2="160"/><line x1="455" y1="116" x2="400" y2="160"/><line x1="625" y1="116" x2="440" y2="160"/></g>
  <rect x="240" y="160" width="240" height="50" rx="10" fill="#eef0f5" stroke="#555" stroke-width="2"/>
  <text x="360" y="183" font-size="13" font-weight="bold" text-anchor="middle">Çekirdek motor</text>
  <text x="360" y="200" font-size="9.5" text-anchor="middle" fill="#666">koleksiyon · depolama · WAL · indeks</text>
  <text x="360" y="245" font-size="10.5" text-anchor="middle" fill="#999">Hepsi aynı dayanıklılık ve depolama temelini paylaşır; ayrı sistem gerekmez</text>
