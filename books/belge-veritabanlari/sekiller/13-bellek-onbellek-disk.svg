<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" font-family="Georgia, serif">
  <rect width="720" height="290" fill="#fbfbf8"/>
  <text x="360" y="28" font-size="14" font-weight="bold" text-anchor="middle">Bellek hızlı ama küçük; disk büyük ama yavaş</text>
  <!-- pyramid -->
  <g text-anchor="middle">
    <polygon points="360,55 270,110 450,110" fill="#cde8d3" stroke="#3a8a52"/><text x="360" y="92" font-size="11">CPU önbelleği — ns</text>
    <polygon points="270,110 450,110 510,180 210,180" fill="#e8eef7" stroke="#2b6cb0"/><text x="360" y="152" font-size="12">RAM (çalışma kümesi) — ~100 ns</text>
    <polygon points="210,180 510,180 600,250 120,250" fill="#eef0f5" stroke="#555"/><text x="360" y="222" font-size="12">Disk / SSD — µs–ms</text>
  </g>
  <text x="630" y="95" font-size="10" text-anchor="middle" fill="#666">hızlı</text>
  <text x="630" y="110" font-size="10" text-anchor="middle" fill="#666">↑</text>
  <text x="630" y="240" font-size="10" text-anchor="middle" fill="#666">↓</text>
  <text x="630" y="225" font-size="10" text-anchor="middle" fill="#666">büyük</text>
  <text x="360" y="275" font-size="10.5" text-anchor="middle" fill="#999">Sık erişilen veri RAM'e sığarsa hızlı; çalışma kümesi taşınca "performans uçurumu"</text>
</svg>
