<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" font-family="Georgia, serif">
  <rect width="720" height="320" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">Pencere fonksiyonu: bölümle → kararlı sırala → çerçeve üzerinde biriktir</text>

  <!-- step 1 partition -->
  <text x="120" y="58" font-size="11.5" text-anchor="middle" font-weight="bold">1. Bölümle (partitionBy)</text>
  <g font-size="10" text-anchor="middle">
    <rect x="40" y="68" width="160" height="22" rx="4" fill="#eef0f5" stroke="#777"/><text x="120" y="83">bölge=Ege</text>
    <rect x="40" y="94" width="160" height="22" rx="4" fill="#e8eef7" stroke="#2b6cb0"/><text x="120" y="109">bölge=Marmara</text>
  </g>

  <!-- step 2 sort -->
  <text x="360" y="58" font-size="11.5" text-anchor="middle" font-weight="bold">2. Kararlı sırala (sortBy: tarih)</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="270" y="68" width="42" height="22" rx="3" fill="#e8eef7" stroke="#2b6cb0"/><text x="291" y="83">Oca</text>
    <rect x="316" y="68" width="42" height="22" rx="3" fill="#e8eef7" stroke="#2b6cb0"/><text x="337" y="83">Şub</text>
    <rect x="362" y="68" width="42" height="22" rx="3" fill="#e8eef7" stroke="#2b6cb0"/><text x="383" y="83">Mar</text>
    <rect x="408" y="68" width="42" height="22" rx="3" fill="#e8eef7" stroke="#2b6cb0"/><text x="429" y="83">Nis</text>
    <rect x="454" y="68" width="42" height="22" rx="3" fill="#e8eef7" stroke="#2b6cb0"/><text x="475" y="83">May</text>
  </g>
  <line x1="200" y1="79" x2="266" y2="79" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- step 3 window frame -->
  <text x="360" y="132" font-size="11.5" text-anchor="middle" font-weight="bold">3. Her satır için çerçeve (documents: [-2, 0]) üzerinde biriktir</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="270" y="146" width="46" height="26" rx="3" fill="#f3f3ee" stroke="#aaa"/><text x="293" y="163">Oca</text>
    <rect x="320" y="146" width="46" height="26" rx="3" fill="#f3f3ee" stroke="#aaa"/><text x="343" y="163">Şub</text>
    <rect x="370" y="146" width="46" height="26" rx="3" fill="#cde8d3" stroke="#3a8a52" stroke-width="2"/><text x="393" y="163">Mar←</text>
    <rect x="420" y="146" width="46" height="26" rx="3" fill="#f3f3ee" stroke="#aaa"/><text x="443" y="163">Nis</text>
    <rect x="470" y="146" width="46" height="26" rx="3" fill="#f3f3ee" stroke="#aaa"/><text x="493" y="163">May</text>
  </g>
  <!-- frame bracket over Oca,Şub,Mar -->
  <path d="M270 142 L270 138 L416 138 L416 142" fill="none" stroke="#3a8a52" stroke-width="1.4"/>
  <text x="343" y="132" font-size="9.5" text-anchor="middle" fill="#3a8a52">çerçeve: kendisi + 2 önceki</text>

  <rect x="540" y="146" width="150" height="26" rx="5" fill="#fdeee0" stroke="#c97b2c"/>
  <text x="615" y="163" font-size="10" text-anchor="middle">Mar.haregOrt = avg(Oca,Şub,Mar)</text>
  <line x1="516" y1="159" x2="538" y2="159" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- output: rows preserved -->
  <text x="360" y="208" font-size="11" text-anchor="middle" fill="#666">Satırlar çökmez: her belge korunur, yalnızca yeni bir alan eklenir</text>

  <!-- function families -->
  <g font-size="10" text-anchor="middle">
    <rect x="60" y="232" width="180" height="48" rx="6" fill="#f3f3ee" stroke="#999"/><text x="150" y="252" font-weight="bold">biriktirici</text><text x="150" y="270">$sum $avg $min $max</text>
    <rect x="270" y="232" width="180" height="48" rx="6" fill="#f3f3ee" stroke="#999"/><text x="360" y="252" font-weight="bold">sıralama</text><text x="360" y="270">$rank $denseRank $documentNumber</text>
    <rect x="480" y="232" width="180" height="48" rx="6" fill="#f3f3ee" stroke="#999"/><text x="570" y="252" font-weight="bold">kaydırma</text><text x="570" y="270">$shift (önceki/sonraki)</text>
  </g>
  <text x="360" y="302" font-size="10.5" text-anchor="middle" fill="#999">Yalnızca belge-tabanlı çerçeve desteklenir; aralık/zaman tabanlı çerçeve henüz yok</text>
</svg>
