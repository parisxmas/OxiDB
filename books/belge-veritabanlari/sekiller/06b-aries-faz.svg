<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" font-family="Georgia, serif">
  <rect width="720" height="330" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">ARIES kurtarma: önce ileri (analiz, yineleme), sonra geri (geri-alma)</text>
  <!-- log timeline -->
  <line x1="60" y1="70" x2="660" y2="70" stroke="#bbb"/>
  <text x="60" y="62" font-size="9.5" fill="#999">günlük başı</text>
  <text x="660" y="62" font-size="9.5" fill="#999" text-anchor="end">çökme</text>
  <circle cx="180" cy="70" r="4" fill="#555"/><text x="180" y="88" font-size="9" text-anchor="middle">son checkpoint</text>
  <circle cx="660" cy="70" r="5" fill="#c0392b"/>
  <!-- phase 1 analiz -->
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="115" width="600" height="46" rx="8" fill="#e8eef7" stroke="#2b6cb0" stroke-width="2"/>
    <text x="170" y="134" font-weight="bold">1. Analiz →</text>
    <text x="420" y="137" font-size="10.5">Checkpoint'ten ileri tara: kirli sayfa tablosunu ve aktif işlemleri yeniden kur</text>
    <text x="420" y="152" font-size="9.5" fill="#666">(yineleme nereden başlayacak, geri-alınacak işlemler hangileri?)</text>
  </g>
  <!-- phase 2 redo -->
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="172" width="600" height="46" rx="8" fill="#e8f3ea" stroke="#3a8a52" stroke-width="2"/>
    <text x="170" y="191" font-weight="bold">2. Yineleme →</text>
    <text x="420" y="194" font-size="10.5">Tüm günlüğü ileri oyna; her sayfanın LSN'i kayıt LSN'inden küçükse uygula</text>
    <text x="420" y="209" font-size="9.5" fill="#666">(idempotent: zaten uygulanmış değişiklik atlanır — "tarihi tekrarla")</text>
  </g>
  <!-- phase 3 undo -->
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="229" width="600" height="46" rx="8" fill="#fde7e1" stroke="#c0392b" stroke-width="2"/>
    <text x="170" y="248" font-weight="bold">← 3. Geri-alma</text>
    <text x="420" y="251" font-size="10.5">Geriye doğru: tamamlanmamış işlemlerin etkilerini telafi kayıtlarıyla geri al</text>
    <text x="420" y="266" font-size="9.5" fill="#666">(CLR = telafi kaydı; geri-almanın kendisi de günlüklenir, tekrar çökmeye dayanıklı)</text>
  </g>
  <g stroke="#888" stroke-width="1.6" marker-end="url(#a)">
    <line x1="360" y1="161" x2="360" y2="170"/><line x1="360" y1="218" x2="360" y2="227"/>
  </g>
  <text x="360" y="300" font-size="10.5" text-anchor="middle" fill="#999">Sonuç: tamamlanmış işlemler kalıcı, tamamlanmamışlar yok edilmiş, veritabanı tutarlı</text>
</svg>
