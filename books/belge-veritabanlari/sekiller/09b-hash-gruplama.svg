<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" font-family="Georgia, serif">
  <rect width="720" height="340" fill="#fbfbf8"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker></defs>
  <text x="360" y="26" font-size="14" font-weight="bold" text-anchor="middle">Hash-tabanlı gruplama: belgeler kovalara akar, her kova bir biriktirici tutar</text>
  <!-- incoming docs -->
  <g font-size="10" text-anchor="middle">
    <rect x="30" y="70" width="120" height="30" rx="6" fill="#e8eef7" stroke="#2b6cb0"/><text x="90" y="89">Ege · 240</text>
    <rect x="30" y="108" width="120" height="30" rx="6" fill="#e8eef7" stroke="#2b6cb0"/><text x="90" y="127">İç · 120</text>
    <rect x="30" y="146" width="120" height="30" rx="6" fill="#e8eef7" stroke="#2b6cb0"/><text x="90" y="165">Ege · 360</text>
    <rect x="30" y="184" width="120" height="30" rx="6" fill="#e8eef7" stroke="#2b6cb0"/><text x="90" y="203">İç · 80</text>
    <rect x="30" y="222" width="120" height="30" rx="6" fill="#e8eef7" stroke="#2b6cb0"/><text x="90" y="241">Ege · 100</text>
  </g>
  <text x="90" y="58" font-size="11" font-weight="bold" text-anchor="middle">belge akışı (bölge · satış)</text>
  <!-- hash function -->
  <g font-size="10" text-anchor="middle">
    <rect x="240" y="130" width="120" height="64" rx="8" fill="#fdeee0" stroke="#c97b2c" stroke-width="2"/><text x="300" y="156">hash(bölge)</text><text x="300" y="174" font-size="9">→ kova adresi</text>
  </g>
  <g stroke="#888" stroke-width="1.3" marker-end="url(#a)">
    <line x1="150" y1="85" x2="238" y2="150"/>
    <line x1="150" y1="123" x2="238" y2="158"/>
    <line x1="150" y1="161" x2="238" y2="162"/>
    <line x1="150" y1="199" x2="238" y2="170"/>
    <line x1="150" y1="237" x2="238" y2="178"/>
  </g>
  <!-- buckets -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="450" y="100" width="230" height="46" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="565" y="120" font-weight="bold">kova "Ege"</text><text x="565" y="138" font-size="9.5">say=3 · toplam=700 · maks=360</text>
    <rect x="450" y="170" width="230" height="46" rx="8" fill="#e8f3ea" stroke="#3a8a52"/><text x="565" y="190" font-weight="bold">kova "İç"</text><text x="565" y="208" font-size="9.5">say=2 · toplam=200 · maks=120</text>
  </g>
  <g stroke="#888" stroke-width="1.4" marker-end="url(#a)">
    <line x1="360" y1="150" x2="448" y2="125"/>
    <line x1="360" y1="168" x2="448" y2="190"/>
  </g>
  <line x1="40" y1="250" x2="680" y2="250" stroke="#ddd"/>
  <text x="360" y="276" font-size="10.5" text-anchor="middle" fill="#666">Her belge, anahtarının hash'iyle bir kovaya yönlenir; kovanın biriktiricileri yerinde güncellenir. Sıralama gerekmez.</text>
  <text x="360" y="298" font-size="10.5" text-anchor="middle" fill="#666">Sıralama-tabanlı alternatif: önce anahtara göre sırala, sonra ardışık aynı-anahtar grupları tek geçişte topla (bellek dostu, çıktı sıralı).</text>
</svg>
