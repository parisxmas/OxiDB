services:
  oxidb:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "4444:4444"
    tmpfs:
      - /data
    environment:
      - OXIDB_ADDR=0.0.0.0:4444
      - OXIDB_DATA=/data
      - OXIDB_POOL_SIZE=4
      - OXIDB_LAZY_SYNC=true
      - OXIDB_SYNC_INTERVAL_MS=100
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/4444' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    tmpfs:
      - /data/db
    command: ["mongod", "--storageEngine", "wiredTiger", "--wiredTigerCacheSizeGB", "0.5"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 30
