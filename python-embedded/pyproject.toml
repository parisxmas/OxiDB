[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oxidb-embedded"
version = "0.25.21"
description = "Embedded OxiDB for Python — run the database in-process via FFI (no server required)"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.8"
authors = [{name = "OxiDB"}]
keywords = ["database", "document", "nosql", "oxidb", "embedded", "ffi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://oxidb.baltavista.com"
Documentation = "https://oxidb.baltavista.com/python-examples.html"
Downloads = "https://oxidb.baltavista.com/downloads.html"

[tool.setuptools.packages.find]
include = ["oxidb_embedded*"]

# Ship the platform-native FFI shared library inside the wheel so
# `pip install oxidb-embedded` "just works" — no separate OXIDB_LIB_PATH
# step. Wheels currently bundle the host build (whatever .dylib/.so/.dll
# was sitting next to the package at build time); a future revision can
# split into per-platform wheels using cibuildwheel.
[tool.setuptools.package-data]
oxidb_embedded = ["*.dylib", "*.so", "*.dll"]
