# OxiBase stack. Copy .env.example → .env, fill the secrets + host, then:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Only the `web` edge is published to the host; the data/control planes and the
# wire port stay on the internal network. Secrets come from .env (never committed).

# Explicit project name so containers/volumes are `oxibase-*` regardless of the
# compose file's directory — never colliding with another stack's project.
name: oxibase

services:
  # Data plane: document + SQL + TSDB engines, REST + wire. Owns the data volume;
  # the control plane reads/writes it over the wire. Holds NO project signing key
  # (it verifies end-user/API tokens with the projects' public keys alone).
  data-plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.oxidb
    image: oxidb-server:local
    environment:
      OXIDB_PLATFORM: "1"                 # enable tenant resolution + project verification
      OXIDB_SQL: "1"
      OXIDB_TSDB: "1"
      OXIDB_ADDR: "0.0.0.0:4444"          # wire (internal only)
      OXIDB_HTTP_PORT: "8087"             # REST (internal, behind nginx)
      OXIDB_WS_PORT: "8089"               # realtime WebSocket (internal, behind nginx /ws)
      OXIDB_DATA: "/data"
      OXIDB_JWT_SECRET: "${OXIDB_JWT_SECRET}"   # guards the default-db / native path
      OXIDB_PGRST_MAX_ROWS: "${OXIDB_PGRST_MAX_ROWS:-1000}"
      # GELF: ingest port (stores messages in the default db's _gelf_logs) +
      # self-emit a message per REST request. Empty = off.
      OXIDB_GELF_PORT: "${OXIDB_GELF_PORT:-}"
      OXIDB_GELF_ADDR: "${OXIDB_GELF_SELF:-}"
      # MessagePack: a cheaper log sink (compact binary, no per-field indexing)
      # on its own port → _msgpack_logs. Empty = off.
      OXIDB_MSGPACK_PORT: "${OXIDB_MSGPACK_PORT:-}"
      OXIDB_MSGPACK_ADDR: "${OXIDB_MSGPACK_SELF:-}"
    volumes:
      - oxidb-data:/data
    restart: unless-stopped

  # Control plane: accounts, projects, per-project keys, end-user auth. Lean
  # (no engine linked). Holds OXIDB_SEAL_KEY to sign project/user tokens.
  oxibase:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.oxibase
    image: oxibase:local
    environment:
      OXIBASE_ADDR: "0.0.0.0:4460"
      OXIBASE_UPSTREAM: "data-plane:4444"
      OXIDB_SEAL_KEY: "${OXIDB_SEAL_KEY}"
      OXIDB_PLATFORM_SECRET: "${OXIDB_PLATFORM_SECRET}"
      # Public origin — the `url` field in project responses, emailed links, and
      # the OAuth callback URL each project registers with its provider.
      OXIDB_PLATFORM_BASE_URL: "${OXIBASE_PUBLIC_URL}"
      OXIDB_PLATFORM_SIGNUP_RATE: "${OXIDB_PLATFORM_SIGNUP_RATE:-5}"
      # Max projects a single developer account may create (default 100).
      OXIDB_PLATFORM_MAX_PROJECTS: "${OXIDB_PLATFORM_MAX_PROJECTS:-100}"
      # Per-project resource quotas written onto each new project (plan-based).
      # The data plane reads these off the project row and enforces them.
      OXIDB_PROJECT_MAX_COLLECTIONS: "${OXIDB_PROJECT_MAX_COLLECTIONS:-5}"
      OXIDB_PROJECT_MAX_TABLES: "${OXIDB_PROJECT_MAX_TABLES:-5}"
      OXIDB_PROJECT_MAX_DOCUMENTS: "${OXIDB_PROJECT_MAX_DOCUMENTS:-10000}"
      # Google OAuth Web client ID — developer console sign-in (public value).
      OXIBASE_GOOGLE_CLIENT_ID: "${OXIBASE_GOOGLE_CLIENT_ID:-}"
      # SMTP submission (the deployment's mail server) — enables end-user email
      # verification + password reset. Empty host = email flows off.
      OXIBASE_SMTP_HOST: "${OXIBASE_SMTP_HOST:-}"
      OXIBASE_SMTP_PORT: "${OXIBASE_SMTP_PORT:-465}"
      OXIBASE_SMTP_USER: "${OXIBASE_SMTP_USER:-}"
      OXIBASE_SMTP_PASSWORD: "${OXIBASE_SMTP_PASSWORD:-}"
      OXIBASE_MAIL_FROM: "${OXIBASE_MAIL_FROM:-}"
      # GELF: emit a message per control-plane request to the data plane's GELF
      # port (e.g. data-plane:12201). Empty = off.
      OXIDB_GELF_ADDR: "${OXIBASE_GELF_ADDR:-}"
      # MessagePack: same, to the data plane's MessagePack port. Empty = off.
      OXIDB_MSGPACK_ADDR: "${OXIBASE_MSGPACK_ADDR:-}"
    depends_on:
      - data-plane
    restart: unless-stopped

  # Public edge: dashboard static + reverse proxy (path-based tenant routing).
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: oxibase-web:local
    environment:
      OXIBASE_HOST: "${OXIBASE_HOST}"
    ports:
      # Bind to localhost by default — put a TLS front (Cloudflare origin / your
      # reverse proxy) in front of it. Set WEB_BIND=0.0.0.0 to expose directly.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8090}:80"
    depends_on:
      - oxibase
      - data-plane
    restart: unless-stopped

volumes:
  oxidb-data:
