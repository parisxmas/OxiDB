[package]
name = "oxidb-tail"
version = "0.28.0"
edition = "2024"
description = "Real-time colored log viewer for OxiDB GELF logs"
license-file = "../LICENSE"
repository = "https://github.com/parisxmas/OxiDB"

[[bin]]
name = "oxidb-tail"
path = "src/main.rs"

[dependencies]
serde_json = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
chrono = "0.4"
ratatui = "0.29"
