# Environment for the SQLite vs OxiDB benchmark.
#
#   julia --project=julia/benchmarks -e 'using Pkg; Pkg.instantiate()'    # once
#   julia --project=julia/benchmarks julia/benchmarks/sqlite_vs_oxidb.jl
#
# Tunables (env vars):
#   OXIDB_BENCH_N      number of documents in the dataset (default 100_000)
#   OXIDB_BENCH_RUNS   measured runs per operation       (default 5)

