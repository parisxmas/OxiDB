<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OxiDB · BTCUSDT realtime (WebGL)</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 14px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    background: #0a0c10;
    color: #e7e9ed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 24px;
    border-bottom: 1px solid #1f242e;
    display: flex;
    align-items: baseline;
    gap: 24px;
  }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  header h1 span { color: #e2784a; }
  .status { color: #6c7585; font-size: 12px; }
  .status .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #d96b6b; margin-right: 6px; vertical-align: middle;
  }
  .status.live .dot { background: #82a98a; box-shadow: 0 0 8px #82a98a55; }
  .stats {
    display: flex; gap: 24px; margin-left: auto; font-size: 12px;
  }
  .stats span { color: #a4adba; }
  .stats b { color: #e7e9ed; font-weight: 500; }
  main { flex: 1; position: relative; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .crosshair {
    position: absolute;
    pointer-events: none;
    background: #181d26ee;
    border: 1px solid #323a48;
    color: #e7e9ed;
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 4px;
    z-index: 10;
    display: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <header>
    <h1>Oxi<span>DB</span> · BTCUSDT</h1>
    <span class="status" id="status"><span class="dot"></span><span id="state">connecting</span></span>
    <div class="stats">
      <span>last <b id="last">—</b></span>
      <span>min <b id="min">—</b></span>
      <span>max <b id="max">—</b></span>
      <span>n <b id="count">0</b></span>
      <span>span <b id="span">—</b></span>
    </div>
  </header>
  <main>
    <canvas id="chart"></canvas>
    <div class="crosshair" id="crosshair"></div>
  </main>
  <script src="oxidb.js"></script>
  <script src="chart.js"></script>
</body>
</html>
