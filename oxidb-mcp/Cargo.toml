[package]
name = "oxidb-mcp"
version = "0.42.12"
edition = "2024"
description = "MCP (Model Context Protocol) server for OxiDB — a stdio front end over the native OxiWire client (ADR-0024)"
license-file = "../LICENSE"
repository = "https://github.com/parisxmas/OxiDB"

[dependencies]
oxidb-client = { path = "../oxidb-client" }
oxidb-http = { path = "../oxidb-http" }
serde_json = "1"

[[bin]]
name = "oxidb-mcp"
path = "src/main.rs"
