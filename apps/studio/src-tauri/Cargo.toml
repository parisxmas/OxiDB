[package]
name = "oxidb-app"
version = "0.3.0"
edition = "2024"

# Keep this Tauri app outside the main OxiDB workspace — its Tauri
# dep tree conflicts with the workspace's resolver. Empty `[workspace]`
# means "I am my own workspace root."
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oxidb = { path = "../.." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
# Capture F5 (Run) even when macOS routes the function-key row to system
# services, so it reaches the app without holding Fn.
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# SCRAM-SHA-256 client handshake (RFC 7677) for authenticated servers.
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false }
getrandom = "0.2"

[lib]
name = "oxidb_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
