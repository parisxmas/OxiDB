[package]
name = "oxidb-embedded-ffi"
version = "0.33.0"
edition = "2024"
description = "C-compatible FFI for embedded (in-process) OxiDB — no server required"
license = "AGPL-3.0-only"
repository = "https://github.com/parisxmas/OxiDB"

[lib]
crate-type = ["staticlib", "cdylib"]

[features]
default = []
android = ["jni"]

[dependencies]
oxidb = { path = ".." }
oxidb-sql = { path = "../oxidb-sql" }
serde_json = "1"
base64 = "0.22"
jni = { version = "0.21", optional = true }
