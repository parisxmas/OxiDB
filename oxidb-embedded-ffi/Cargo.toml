[package]
name = "oxidb-embedded-ffi"
version = "0.42.12"
edition = "2024"
description = "C-compatible FFI for embedded (in-process) OxiDB — no server required"
license-file = "../LICENSE"
repository = "https://github.com/parisxmas/OxiDB"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Full build. A mobile "lite" build (`--no-default-features [--features
# android]`) drops the SQL engine and the PDF/DOCX/XLSX text extractors —
# the two heaviest optional parts — and shrinks the library by roughly half.
default = ["sql", "doc-formats"]
sql = ["dep:oxidb-sql"]
doc-formats = ["oxidb/doc-formats"]
android = ["jni"]

[dependencies]
oxidb = { path = "..", default-features = false }
oxidb-sql = { path = "../oxidb-sql", optional = true }
serde_json = "1"
base64 = "0.22"
jni = { version = "0.21", optional = true }

[dev-dependencies]
tempfile = "3"
