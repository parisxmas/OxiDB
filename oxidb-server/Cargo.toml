[package]
name = "oxidb-server"
version = "0.34.17"
edition = "2024"
description = "TCP server for OxiDB document database"
license-file = "../LICENSE"
repository = "https://github.com/parisxmas/OxiDB"

[features]
default = ["s3"]
ocr = ["oxidb/ocr"]
s3 = []
cluster = ["openraft", "tokio", "tokio-rustls"]
gpu = ["oxidb/gpu"]

[dependencies]
oxidb = { path = ".." }
oxidb-sql = { path = "../oxidb-sql" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"  # gzip rotated audit files (audit.rs)
rustls = "0.23"
rustls-pemfile = "2"
# Mozilla CA bundle for outbound HTTPS in the REST FDW adapter
# (rest_adapter::tls_config). Pure-Rust, no system-cert dependency.
webpki-roots = "0.26"
argon2 = "0.5"
sha1 = "0.10"
sha2 = "0.10"
mlua = { version = "0.10", features = ["lua54", "vendored"] }  # OxiMem EVAL scripting
md-5 = "0.10"
hmac = "0.12"
rand = "0.9"
aes-gcm = "0.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rmp = "0.8"
rmp-serde = "1"
socket2 = "0.5"
libc = "0.2"
crossbeam-channel = "0.5"
simd-json = "0.14"
openraft = { version = "0.9", features = ["serde"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "time", "macros", "sync"], optional = true }
tokio-rustls = { version = "0.26", optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
tempfile = "3"
hmac = "0.12"
sha2 = "0.10"
openraft = { version = "0.9", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "time", "macros", "sync"] }
# self-signed cert generation for the REST FDW HTTPS integration test
rcgen = "0.13"
