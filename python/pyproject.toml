[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oxidb"
version = "0.22.0"
description = "Python client for OxiDB — a fast, embeddable document database"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "OxiDB"}]
keywords = ["database", "document", "nosql", "oxidb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://oxidb.baltavista.com"
Documentation = "https://oxidb.baltavista.com/clients.html"
Downloads = "https://oxidb.baltavista.com/downloads.html"

[tool.setuptools]
py-modules = ["oxidb"]
