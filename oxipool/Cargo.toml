[package]
name = "oxipool"
version = "0.32.0"
edition = "2024"
description = "Connection pooler for OxiDB — like PgBouncer for OxiDB. Supports sharded routing."
license = "AGPL-3.0-only"
repository = "https://github.com/parisxmas/OxiDB"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
oxidb-agg-merge = { path = "../oxidb-agg-merge" }

[dev-dependencies]
# E2E test starts in-process shard servers (oxidb + the server's request
# handler) behind the real oxipool binary.
oxidb = { path = ".." }
oxidb-server = { path = "../oxidb-server" }
tempfile = "3"
