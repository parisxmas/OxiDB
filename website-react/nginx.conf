server {
    listen 80;
    server_name oxidb.baltavista.com;
    root /var/www/oxidb;
    index index.html;

    # Ensure correct MIME types
    include mime.types;

    # Redirect .html URLs to clean URLs (for old bookmarks/links)
    location ~ ^/(.+)\.html$ {
        return 301 /$1/;
    }

    # Serve static assets (Next.js bundles, CSS, JS)
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve release binaries
    location /releases/ {
        try_files $uri =404;
    }

    # Clean URL routing: /features/ -> /features/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
